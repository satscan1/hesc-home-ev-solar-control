set_charge_plan:
  fields:
    car:
      required: false
      default: ev1
      example: ev2
      selector:
        select:
          options:
            - ev1
            - ev2
    day:
      required: false
      example: Tomorrow
      selector:
        select:
          options:
            - Today
            - Tomorrow
            - Mon
            - Tue
            - Wed
            - Thu
            - Fri
            - Sat
            - Sun
    time:
      required: false
      example: "07:00"
      selector:
        text:
    goal:
      required: false
      example: 80
      selector:
        number:
          min: 15
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

charge_plan_off:
  fields:
    car:
      required: false
      default: ev1
      example: ev2
      selector:
        select:
          options:
            - ev1
            - ev2

