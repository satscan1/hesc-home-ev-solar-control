      content: '### Situaties


        #### "Ik rijd elke werkdag naar mijn werk"


        Maak een **weekplan**: vink de dagen aan, zet je vertrektijd en het niveau dat je wilt. Laat het aan staan. Stekker erin als je thuiskomt. Klaar.


        #### "Ik ga zaterdag op reis"


        Gebruik het plan **één vaste dag per week**: kies *zaterdag*, je vertrektijd en bijvoorbeeld 100%, en zet het aan. Staan dit plan en het weekplan allebei aan, dan gaat het vroegste voor; je weekplan gaat gewoon door.


        Dit plan komt elke week terug op dezelfde dag en tijd. Heb je het maar één keer nodig? Zet *Actief* na de reis weer uit.


        #### "De auto blijft een paar dagen thuis"


        Geen plan nodig. De auto laadt op zon, pakt goedkope kansen als ze komen, en verder blijft de laadpaal op pauze. Pas als de auto meer dan 3% onder *Auto telt als vol bij* zakt, laadt HESC hem bij.


        #### "Ik kom thuis met een bijna lege accu en heb de auto vanavond misschien nog nodig"


        Zet **Minimumlading** aan (Instellingen, blok 3, *Aan*). Standaard: minstens 20% binnen 3 uur. HESC kiest de goedkoopste kwartieren in die 3 uur, en laadt meteen als er geen prijzen bekend zijn. Beide getallen kun je aanpassen onder *Opties*.


        #### "Ik heb een thuisbatterij en de auto krijgt nooit zon"


        Zet **Thuisbatterij en auto** aan (Instellingen, blok 3, *Aan*) en vul je thuisbatterij in onder *Opties*. Zie *Thuisbatterij en auto* hierboven.


        #### "Ik heb de auto nu nodig, laat het plan maar"


        Start zelf met laden (app, knop op de laadpaal of de eigen stand van de laadpaal). HESC ziet dat de auto al laadt en laat hem met rust.


        #### "Ik heb laat aangesloten; is er nog tijd?"


        HESC houdt dat steeds in de gaten. Is de resterende tijd nog maar net genoeg, dan start het vangnet meteen. Wordt het doel toch niet gehaald, dan krijg je op je vertrektijd een melding op je telefoon: *EV goal missed*, met de stand die gehaald is.


        #### "Morgen wordt het zonnig"


        Het plan rekent de zon vooraf mee (voorzichtige verwachting, min een beetje voor het huis), dus het koopt minder van het net. Goedkope kansen die de zon overbodig maakt, worden overgeslagen.


        #### "De prijzen voor morgen zijn nog niet bekend"


        Normaal vóór ongeveer 13:00. Na de eerste dagen gebruikt het plan verwachte prijzen (grijze staven) en wordt het definitief zodra de echte prijzen er zijn.


        #### "Mijn auto stopt zelf bij 80%"


        Veel auto''s hebben een eigen laadgrens. Ligt die lager dan je doel, dan stopt de laadpaal vanzelf en toont HESC *Finished, charger stopped by itself*. Zet je doel op of onder de grens van de auto, of verhoog die grens in de auto.


        #### "De laadpaal reageerde niet"


        Laadpalen die via de cloud werken, negeren soms een opdracht. HESC controleert en probeert opnieuw: een geweigerde start of hervatting na 5 minuten, een geweigerde pauze na 30 minuten, elk hoogstens 3 keer. Voordat HESC de laadpaal terugzet in zijn zonnestand, wacht het tot de pauze echt is doorgekomen.


        #### "Home Assistant is tijdens het laden herstart"


        HESC gebruikt het laatste geldige plan nog tot 10 minuten, zodat een lopende lading niet stopt.


        #### "Ik heb Home Assistant net herstart en sommige waarden zijn leeg, of de setup-controle toont een rode <ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>"


        Dat is normaal en komt vanzelf goed; je hoeft niets te doen. Prijzen, instellingen en de setup-controle zijn er meteen weer; accuniveau van de auto, kosten en de meldingenregel binnen ongeveer 5 minuten; de prijsvoorspelling (verwachte prijzen in de grafiek) binnen 15 minuten; het advies voor de startdrempel binnen een paar minuten. Een rode <ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> kan even verschijnen terwijl de koppeling van je laadpaal, omvormer of auto nog opstart. Na 15 minuten nog steeds rood? Dan ontbreekt er echt iets, en gaan de juiste instellingen vanzelf open. Vlak na een herstart kan de koppeling van de auto ook even een oud accuniveau geven; HESC neemt de correctie mee bij de volgende ronde.


        #### "Ik ga op vakantie"


        Zet **Vakantiemodus** aan, onder het weekplan. Het weekplan doet dan niets; je dagplan blijft actief, zodat je op de dag dat je terugkomt toch een volle auto kunt hebben. Laden op zon gaat gewoon door. Vul eventueel **Vakantie tot** in: de dag na die datum gaat de vakantiemodus vanzelf uit.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Wat je één keer instelt


        | Instelling | Waar | Standaard | Tip |

        |---|---|---|---|

        | Bruikbare accucapaciteit | tabblad *Laadplan* | 60 kWh | Wat je auto echt kan gebruiken |

        | Laadvermogen van het net | tabblad *Laadplan* | 11 kW | Iets onder wat je laadpaal echt levert geeft wat marge |

        | Goedkope kansen pakken / Goedkoop onder | tabblad *Laadplan* | eigen keuze / 0,05 per kWh | In de munt van je prijzen. Lager = minder maar betere kansen |

        | Auto telt als vol bij | tabblad *Laadplan* en Instellingen | 80% | Het niveau dat zonder plan wordt vastgehouden |

        | Eindcontrole | Instellingen | 60 min | Hoe lang voor vertrek HESC laadt, wat de prijs ook is |

        | Minimumlading | Instellingen, blok 3 | uit (20%, 3 uur) | Schakelaars *Aan* + *Opties* |

        | Thuisbatterij en auto | Instellingen, blok 3 | uit (3 per dag) | Alleen met een thuisbatterij; schakelaars *Aan* + *Opties* |

        | Terug naar zonnestand | Instellingen, blok 3, *Laadplan en meldingen* | ingevuld bij Wallbox | Zet de laadpaal na netladen terug in zijn eigen zonnestand |

        | Telefoons voor meldingen | Instellingen, blok 3, *Laadplan en meldingen* | geen | Kies ze uit de lijst; test met *Testmelding sturen* |

        | Ochtendoverzicht | Instellingen, blok 3, *Laadplan en meldingen* | uit (06:00) | Eén bericht per dag: accuniveau, volgend plan, zon vandaag, gisteren |

        | Laadkosten | Instellingen, *Laadkosten* | opslag 0, btw 0, zon-kWh gratis | Of zet *all-in* aan als je prijssensor al de volledige prijs geeft |'
      grid_options:
        columns: full
    - type: markdown
      content: '### Waar je kijkt


        - **Status** op het dashboard: één regel met wat HESC nu doet en waarom.

        - **Prijsgrafiek** (tabblad *Laadplan*): oranje = gepland, blauwgroen = goedkope kans, grijs = verwachte prijs.

        - **Meldingenregel** (bovenaan Overzicht): *✓ Geen meldingen*, of wat aandacht nodig heeft. Rood = het laaddoel komt in gevaar (ook op je telefoon), oranje = een sensor ontbreekt maar HESC werkt door, grijs = ter info. Tik erop om naar de plek te gaan waar je iets kunt doen.

        - **Verwachte laadkosten** (kadertje bovenaan Overzicht): wat het actieve plan naar verwachting kost.

        - **Kosten** (kadertje bovenaan Overzicht): wat er in de auto ging, van de zon en van het net, en wat het kostte.

        - **Controle** (tabblad *Instellingen*): één regel per onderdeel met een vinkje en de waarden van nu. Klopt er iets niet, dan gaat dat onderdeel vanzelf open en zegt het wat er ontbreekt.

        - **Rapport**: alles wat HESC gemeten en besloten heeft, voor jezelf of als je om hulp vraagt.


        Zie ook: [Hoe het werkt](https://github.com/satscan1/hesc-home-ev-solar-control/blob/main/docs/04-how-it-works.nl.md) voor de details, en [Een dag met HESC](https://github.com/satscan1/hesc-home-ev-solar-control/blob/main/docs/08-a-day-with-hesc.nl.md) voor een voorbeelddag.'
