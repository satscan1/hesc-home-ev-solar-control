      content: '### <ha-icon icon="hesc:boek" style="--mdc-icon-size:22px;vertical-align:-5px;margin-right:4px"></ha-icon>Intelligentes Laden erklärt


        *Eine Anleitung für alle: was HESC mit deinem Auto macht, warum, und was du noch selbst tust.*


        [English version](/hesc-v3/guide) · [Nederlandse versie](/hesc-v3/guide-nl)'
      grid_options:
        columns: full
    - type: markdown
      content: '### Kurz gesagt


        Nach etwa zwei Wochen läuft HESC fast von allein. Dein Teil ist klein:


        1. **Steck das Auto an**, wenn du nach Hause kommst.

        2. **Sorge dafür, dass dein Plan zu deiner Abfahrt passt.** Ein Wochenplan für deine üblichen Tage (zum Beispiel *80 % an Werktagen um 07:30*) und der Plan *ein fester Tag pro Woche* für einen zusätzlichen Tag (*100 % samstags um 09:00*).


        Den Rest erledigt HESC. Zwischen dem Anstecken und der Abfahrt sucht es den günstigsten Weg, das Auto dorthin zu bringen, wo du es haben willst. Zuerst nutzt es kostenlose Sonne, dann die günstigsten Stunden aus dem Netz, und es behält immer ein Sicherheitsnetz, damit das Auto rechtzeitig fertig ist.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Warum die ersten zwei Wochen zählen


        Das meiste funktioniert vom ersten Tag an: Solarladen, der Ladeplan, das Sicherheitsnetz und die Zielprüfung.


        Eines wird mit der Zeit besser: **der Blick auf die Preise von morgen.** Die Strompreise für morgen werden gegen 13:00 veröffentlicht. Vorher kennt sie niemand. HESC füllt diese Lücke mit einem erwarteten Preis, auf Basis der Preise deiner eigenen letzten 14 Tage und davon, wie sonnig es morgen wird (an sonnigen Tagen ist es mittags meist günstig und abends teuer).


        - **Der erste Tag:** noch keine erwarteten Preise. HESC plant nur mit den bekannten Preisen. Das ist in Ordnung; das Sicherheitsnetz macht das Auto trotzdem fertig.

        - **Nach einem vollen Tag:** eine grobe Erwartung, einfach das Muster von gestern. Erwartete Preise erscheinen als graue Balken in der Preisgrafik, und der Plan kann sie nutzen.

        - **Ab Tag 3:** die Erwartung nutzt den Durchschnitt aller vollen Tage bis dahin.

        - **Ab Tag 14:** sie beruht auf zwei vollen Wochen deiner eigenen Preise.

        - **Danach jede Woche:** HESC verfeinert mit deinem eigenen Verlauf, wie Sonne und Preis auf deinem Markt zusammenhängen.


        Erwartete Preise sind eine Schätzung, und so behandelt HESC sie auch: ein bekannter Preis gewinnt immer gegen einen erwarteten, es sei denn, der erwartete ist deutlich günstiger (2 Cent pro kWh oder mehr). Sobald die echten Preise da sind, nutzt der Plan diese.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Die Reihenfolge, der HESC folgt


        Alle 30 Sekunden schaut HESC auf das Auto, die Sonne, die Preise und deinen Plan und stellt sich dieselben Fragen in derselben Reihenfolge:


        | # | Frage | Was passiert |

        |---|---|---|

        | 1 | **Scheint die Sonne?** | Deine Wallbox lädt im eigenen Solar-/Eco-Modus mit Sonne, wie sie es immer getan hat (mit HPVC bittet HESC zuerst HPVC, die Sonne durchzulassen). HESC folgt ihr und rechnet die Sonne in den Plan ein, damit es keine Energie kauft, die die Sonne ohnehin liefert. |

        | 2 | **Ist es eine der geplanten günstigsten Viertelstunden?** | HESC startet die Wallbox für diese Viertelstunde aus dem Netz. |

        | 3 | **Wird die Zeit knapp?** | **Sicherheitsnetz:** reicht die verbleibende Zeit gerade noch für das Ziel, startet HESC das Laden, egal zu welchem Preis. |

        | 4 | **Ist es die letzte Stunde vor der Abfahrt und fehlt dem Auto noch etwas?** | **Letzte Prüfung:** HESC lädt bis zu deinem Ziel, egal zu welchem Preis. |

        | 5 | **Ist der Preis gerade sehr niedrig?** | **Günstige Gelegenheit:** HESC lädt jetzt, auch ohne Plan, *außer* es wird später am Tag genug Sonne für dieselbe Aufgabe erwartet (siehe unten). |

        | 6 | **Liegt das Auto unter dem Minimum, das du eingestellt hast?** | **Mindestladung** (optional, standardmäßig aus): das Auto bekommt innerhalb weniger Stunden mindestens diesen Ladestand, in den günstigsten Viertelstunden dieses Zeitfensters. |

        | 7 | Nichts davon | HESC wartet. Das Dashboard sagt dir, warum, zum Beispiel *Waiting for the next planned quarter*. |


        Für all das gelten ein paar Regeln:


        - **3 % Spielraum.** HESC startet das Laden aus dem Netz erst, wenn das Auto mehr als 3 % unter dem Ziel liegt. Ein Auto bei 78 % mit Ziel 80 % bleibt in Ruhe; bei 76,9 % lädt es. So wird die Wallbox nicht für ein paar Minuten Nichts gestartet.

        - **Welches Ziel?** Mit einem aktiven Plan: das Ziel dieses Plans. Ohne Plan (günstige Gelegenheiten, Nachladen): *Auto gilt als voll bei* (Standard 80 %). Eine günstige Gelegenheit füllt nie ein Auto, das schon als voll gilt.

        - **HESC macht nur rückgängig, was es selbst begonnen hat.** Startest du das Laden selbst, oder lädt das Auto schon mit Sonne, lässt HESC es in Ruhe.

        - **Nach dem Netzladen bleibt die Wallbox nicht an** (Wallboxen mit Start/Stopp-Schalter). Sonst könnte das Auto sich abends in der Spitzenzeit still aus dem Netz nachladen. Ist *Zurück in den Solarmodus* ausgefüllt (Wallbox: *Resume schedule*; HESC füllt es selbst aus), pausiert HESC die Wallbox, prüft, ob die Pause wirklich angekommen ist (Wallboxen über die Cloud reagieren etwa eine Minute später), und setzt sie dann zurück in ihren eigenen Solarmodus, sodass die nächste sonnige Stunde das Auto von selbst lädt. Ohne dieses Feld bleibt die Wallbox pausiert, und HESC schaltet sie wieder ein, wenn genug Sonne da ist, wenn das Auto mehr als 3 % unter das Ziel fällt und kein geplantes Laden kommt, wenn ein Plan startet oder wenn du absteckst.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Wie der Plan die günstigsten Stunden wählt


        Angenommen, du steckst um 18:00 an, das Auto steht bei 40 %, und dein Wochenplan sagt *80 % um 07:30*.


        1. **Wie viel wird gebraucht?** 40 % eines 60-kWh-Akkus = 24 kWh.

        2. **Wie viel kommt vor 07:30 von der Sonne?** Nichts, es ist Nacht. (Bei einem Samstagsplan für 14:00 würde die Morgensonne mitzählen.)

        3. **Wie lange dauert das aus dem Netz?** Bei 11 kW: etwas über 2 Stunden, also 9 Viertelstunden.

        4. **Welche 9 Viertelstunden?** Die günstigsten zwischen jetzt und 07:30. Meist irgendwo in der Nacht.


        Die geplanten Viertelstunden erscheinen **bernsteinfarben** in der Preisgrafik auf der Seite *Ladeplan*. Ist kein Plan aktiv, zeigt die Grafik keine geplanten Viertelstunden, und die Plankarte sagt *Kein Ladeplan aktiv*.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Günstige Gelegenheiten und die Sonne


        *Günstige Gelegenheiten nutzen* (auf der Seite *Ladeplan*) lädt immer dann, wenn der Preis unter *Günstig unter* fällt, auch ohne Plan. Diese Momente erscheinen **blaugrün** in der Preisgrafik.


        Ein günstiger Moment am Morgen ist aber kein Schnäppchen, wenn die Nachmittagssonne das Auto kostenlos gefüllt hätte. Bevor HESC eine günstige Gelegenheit nutzt, schaut es deshalb auf die Solarprognose für den Rest des Tages. Deckt die erwartete Sonne das, was das Auto noch braucht, mit 20 % Reserve, wird die günstige Gelegenheit ausgelassen. Du siehst dann *Cheap chance skipped: enough sun today*, und die Preisgrafik lässt diese Viertelstunden weg.


        **Netzladen und Sonne gleichzeitig.** Lässt deine Wallbox HESC den Ladestrom einstellen (bei einer Wallbox: die Einstellung *Maximum charging current*, die ein Administratorkonto braucht), regelt HESC die Wallbox herunter, während sie aus dem Netz lädt und die Sonne scheint. Dann kommt mehr von der Ladung von deinen Solarpaneelen und weniger aus dem Netz. Das ist normales Verhalten, du musst nichts einschalten: HESC tut es nur, solange das Auto trotzdem rechtzeitig voll ist, und stellt den Strom danach wieder zurück. Ob deine Wallbox 1 oder 3 Phasen nutzt, ermittelt HESC selbst.


        **Phasenhinweis.** Manche Wallboxen starten erst, wenn jede Phase genug Sonne übrig hat (eine Wallbox im Eco-Modus etwa 480 W pro Phase, ein Easee 6 A pro Phase). Sind deine Solarpaneele ungleich auf die Phasen verteilt, entscheidet dann die schwächste Phase, wann dein Auto mit Sonne laden kann. Wählst du unter den Quellen die Netzleistung pro Phase, misst HESC das an sonnigen Tagen und sagt dir, was es gesehen hat: zuerst die Verteilung über die Phasen, später, wie oft die schwächste Phase deine Wallbox am Starten gehindert hat. Die sonnigste Zeit wird für deinen Standort berechnet, deshalb sagt HESC erst *bestätigt*, wenn es sie gesehen hat. Es ist nur ein Hinweis, HESC ändert nichts.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Hausspeicher und Auto


        *Optional, standardmäßig aus. Nur für Häuser mit einem Hausspeicher.*


        An einem sonnigen Morgen nimmt meist der Hausspeicher zuerst die ganze überschüssige Sonne. Die Wallbox im Solarmodus sieht dann keinen Überschuss und wartet, manchmal bis der Hausspeicher am Nachmittag voll ist. An einem Tag mit weniger Sonne kann das heißen, dass das Auto nichts bekommt.


        Mit **Hausspeicher und Auto** eingeschaltet hilft HESC dem Auto, an die Reihe zu kommen:


        1. **Kickstart.** Ist das Auto angesteckt und wartet auf Sonne, lädt der Hausspeicher seit ein paar Minuten und sagt die vorsichtige Prognose, dass jetzt genug Sonne da ist, prüft HESC den Rest des Tages. Ist deutlich mehr Sonne übrig, als der Hausspeicher noch braucht (mit 20 % Reserve und mindestens *Minimale Restsonne für das Auto*)? Dann gibt HESC der Wallbox einen kurzen Start. Dein Batteriesystem sieht, dass das Auto lädt, und hört auf, den Hausspeicher zu füllen; HESC setzt die Wallbox danach zurück in ihren eigenen Solarmodus, der mit der nun freien Sonne weiterlädt.

        2. **Zurück zum Hausspeicher.** Später am Tag, wenn die restliche Sonne gerade noch reicht, um den Hausspeicher zu füllen, lässt HESC die Wallbox wieder warten, damit der Hausspeicher bis zum Abend voll ist. Danach gibt es an diesem Tag keinen neuen Kickstart.


        Während des kurzen Starts kann der Hausspeicher kurz etwas Leistung an das Auto abgeben. Das ist erwartet und gering.


        HESC steuert den Hausspeicher nie selbst. Es entscheidet nur, wann das Auto startet, und liest Ladestand und Leistung des Hausspeichers. Es tut nichts, während ein Ladeplan lädt, während einer HPVC-Freigabe oder nach Sonnenuntergang, und höchstens ein paar Mal am Tag (*Kickstarts pro Tag*, Standard 3, mit mindestens 30 Minuten dazwischen).


        Was du ausfüllst (Einstellungen, Block 3, *Hausspeicher und Auto* → *Optionen*): den oder die Ladestandsensoren deines Hausspeichers, den oder die Leistungssensoren (positiv = laden) und seine Gesamtgröße in kWh. Außerdem braucht es den Start/Stopp-Schalter der Wallbox und *Zurück in den Solarmodus* (Block 3, *Ladeplan und Meldungen*); beim Wallbox-Typ Wallbox ist beides schon ausgefüllt. Ist das Auto angesteckt, zeigt die Übersicht in einer zusätzlichen Zeile unter *Aktueller Stand*, was es gerade tut.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Was wird es kosten?


        Die Anzeige **Erwartete Ladekosten** oben auf der Übersicht zeigt, was der aktive Plan aus dem Netz voraussichtlich kostet, nach derselben Regel wie die Seite Kosten (der Preis jeder geplanten Viertelstunde plus dein Aufschlag und die MwSt., oder der Endpreis). Sie zählt nur Netzladen, das wirklich stattfindet: ohne aktiven Plan, wenn das Auto sein Ziel schon erreicht hat oder schon mit Sonne lädt, zeigt sie 0,00.


        **Was hat es gekostet?** Tippe auf der Übersicht auf **Kosten**. Pro Tag, Woche, Monat, Quartal oder Jahr siehst du, wie viel ins Auto ging, wie viel davon von der Sonne (grün) und aus dem Netz (grau) kam, und was der Netzanteil zum Preis der jeweiligen Viertelstunde gekostet hat. Aufschlag, MwSt. und den Wert einer Solar-kWh stellst du einmal unter *Einstellungen → Ladekosten* ein; der ganze Verlauf wird angepasst. **In Tabelle exportieren (CSV)** ganz unten schreibt zwei Dateien, die du in Excel öffnen kannst.


        Alle Beträge sind in der Währung deiner Preise (€, kr, £ oder $), so geschrieben, wie es in deinem Land üblich ist.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Auf Telefon und Uhr


        HESC funktioniert mit der Home-Assistant-App auf deinem iPhone (oder Android-Telefon), auch unterwegs.


        - **Widget oder Apple Watch:** füge in der Home-Assistant-App den Sensor *Zusammenfassung für Telefon und Uhr* als Widget oder als Komplikation auf der Uhr hinzu. Er zeigt zum Beispiel *EV 72% → 80% by Sat 24-10 07:00 · Charging on sun*.

        - **Siri oder Kurzbefehle:** erstelle einen Kurzbefehl mit der Home-Assistant-Aktion *Aktion ausführen* → **HESC: Ladeplan festlegen** (Tag, Uhrzeit, Ziel) oder **HESC: Ladeplan aus**. Sag dann zum Beispiel *Hey Siri, lade das Auto für morgen*. Außerdem gibt es: **HESC: Jetzt laden** (bis zu einem Ziel, aus dem Netz, sofort), **HESC: Einen Tag des Wochenplans überspringen** (ein freier Tag; der Plan selbst bleibt) und die zwei, die das rückgängig machen.

        - **Sperrbildschirm:** das Widget *Details* oder *Gauge* der Home-Assistant-App folgt der Zusammenfassung sofort: HESC bittet die iPhones in seiner Telefonliste, es zu aktualisieren, wenn sich etwas ändert (höchstens alle 20 Minuten). Die Widgets auf dem Homescreen aktualisieren sich etwa alle 15 Minuten, das entscheidet iOS.

        - **Android und Wear OS:** das Widget *Entity state* mit der Zusammenfassung und ein Widget *Action button*, eine Schnelleinstellungskachel oder eine Uhrenkachel, die eine HESC-Taste drückt (jetzt laden, stoppen, Tag überspringen, Plan aus) oder dein eigenes Skript ausführt. Android-Widgets aktualisieren sich von selbst (sofort mit *Real-time* im Benachrichtigungszugriff der App).

        - **Benachrichtigungen:** wähle dein Telefon auf der Seite Einstellungen (*Telefon hinzufügen oder entfernen*).'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: markdown
      content: '### Situationen


        #### "Ich fahre jeden Werktag zur Arbeit"


        Erstelle einen **Wochenplan**: hake die Tage an, stelle die Abfahrtszeit und den gewünschten Ladestand ein. Lass ihn aktiv. Steck an, wenn du nach Hause kommst. Das ist alles.


        #### "Am Samstag mache ich einen Ausflug"


        Nutze den Plan **ein fester Tag pro Woche**: wähle *Samstag*, die Abfahrtszeit und zum Beispiel 100 %, und schalte ihn ein. Sind er und der Wochenplan beide aktiv, gewinnt der frühere; dein Wochenplan läuft einfach weiter.


        Dieser Plan kommt jede Woche am selben Tag und zur selben Uhrzeit wieder. Brauchst du ihn nur einmal? Schalte *Aktiv* nach dem Ausflug aus.


        #### "Das Auto bleibt ein paar Tage zu Hause"


        Kein Plan nötig. Das Auto lädt mit Sonne, nutzt günstige Gelegenheiten, wenn sie kommen, und sonst bleibt die Wallbox pausiert. Erst wenn das Auto mehr als 3 % unter *Auto gilt als voll bei* fällt, lädt HESC nach.


        #### "Ich bin mit fast leerem Akku heimgekommen und brauche das Auto vielleicht heute Abend"


        Schalte **Mindestladung** ein (Einstellungen, Block 3, *An*). Standard: mindestens 20 % innerhalb von 3 Stunden. HESC wählt die günstigsten Viertelstunden in diesen 3 Stunden und lädt sofort, wenn keine Preise bekannt sind. Beide Zahlen kannst du unter *Optionen* ändern.


        #### "Ich habe einen Hausspeicher und das Auto bekommt nie Sonne"


        Schalte **Hausspeicher und Auto** ein (Einstellungen, Block 3, *An*) und trage deinen Hausspeicher unter *Optionen* ein. Siehe *Hausspeicher und Auto* oben.


        #### "Ich brauche das Auto jetzt, vergiss den Plan"


        Starte das Laden selbst (App, Taste an der Wallbox oder der eigene Modus der Wallbox). HESC sieht, dass das Auto schon lädt, und lässt es in Ruhe.


        #### "Ich habe spät angesteckt; reicht die Zeit noch?"


        HESC prüft das ständig. Reicht die verbleibende Zeit gerade noch, startet das Sicherheitsnetz sofort. Wird das Ziel trotzdem verfehlt, bekommst du zu deiner Abfahrtszeit eine Benachrichtigung aufs Telefon: *EV goal missed*, mit dem erreichten Ladestand.


        #### "Morgen wird es sonnig"


        Der Plan rechnet die Sonne vorab ein (vorsichtige Prognose, minus etwas für das Haus) und kauft deshalb weniger aus dem Netz. Günstige Gelegenheiten, die die Sonne überflüssig machen würde, werden ausgelassen.


        #### "Die Preise von morgen sind noch nicht bekannt"


        Normal vor etwa 13:00. Nach den ersten Tagen nutzt der Plan erwartete Preise (graue Balken) und wird genauer, sobald die echten Preise da sind.


        #### "Mein Auto hört bei 80 % von selbst auf"


        Viele Autos haben ein eigenes Ladelimit. Liegt es unter deinem Ziel, stoppt die Wallbox von selbst, und HESC zeigt *Finished, charger stopped by itself*. Setze dein Ziel auf oder unter das Limit des Autos, oder erhöhe das Limit im Auto.


        #### "Die Wallbox hat nicht reagiert"


        Wallboxen, die über die Cloud arbeiten, ignorieren manchmal einen Befehl. HESC prüft und versucht es erneut: einen abgelehnten Start oder ein abgelehntes Fortsetzen nach 5 Minuten, eine abgelehnte Pause nach 30 Minuten, jeweils höchstens 3 Mal. Bevor HESC die Wallbox zurück in ihren Solarmodus setzt, wartet es, bis die Pause wirklich angekommen ist.


        #### "Home Assistant wurde während des Ladens neu gestartet"


        HESC nutzt den letzten gültigen Plan bis zu 10 Minuten weiter, damit ein laufendes Laden nicht stoppt.


        #### "Ich habe Home Assistant gerade neu gestartet und manche Werte sind leer, oder die Prüfung der Einrichtung zeigt ein rotes <ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>"


        Das ist normal und erledigt sich von selbst; du musst nichts tun. Preise, Einstellungen und die Prüfung der Einrichtung sind sofort wieder da; Ladestand des Autos, Kosten und die Hinweiszeile innerhalb von etwa 5 Minuten; die Preisprognose (erwartete Preise in der Grafik) innerhalb von 15 Minuten; die Empfehlung zur Startschwelle innerhalb weniger Minuten. Ein rotes <ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> kann kurz erscheinen, während die Integration deiner Wallbox, deines Wechselrichters oder deines Autos noch startet. Nach 15 Minuten noch rot? Dann fehlt wirklich etwas, und die passenden Einstellungen öffnen sich von selbst. Direkt nach einem Neustart kann die Integration des Autos auch kurz einen alten Ladestand melden; HESC folgt der Korrektur in seiner nächsten Runde.


        #### "Ich bin im Urlaub"


        Schalte **Urlaubsmodus** unter dem Wochenplan ein. Der Wochenplan tut dann nichts; dein Plan für einen Tag bleibt aktiv, sodass du am Tag deiner Rückkehr trotzdem ein volles Auto haben kannst. Solarladen läuft wie gewohnt weiter. Stelle bei Bedarf **Urlaub bis** ein: am Tag nach diesem Datum schaltet sich der Urlaubsmodus von selbst aus.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Was du einmal einstellst


        | Einstellung | Wo | Standard | Tipp |

        |---|---|---|---|

        | Nutzbare Akkukapazität | Seite *Ladeplan* | 60 kWh | Was dein Auto wirklich nutzen kann |

        | Ladeleistung aus dem Netz | Seite *Ladeplan* | 11 kW | Etwas unter dem, was deine Wallbox wirklich liefert, gibt etwas Reserve |

        | Günstige Gelegenheiten nutzen / Günstig unter | Seite *Ladeplan* | deine Wahl / 0,05 pro kWh | In der Währung deiner Preise. Niedriger = weniger, aber bessere Gelegenheiten |

        | Auto gilt als voll bei | Seite *Ladeplan* und Einstellungen | 80 % | Der Ladestand, der ohne Plan gehalten wird |

        | Letzte Prüfung | Einstellungen | 60 min | Wie lange vor der Abfahrt HESC lädt, egal zu welchem Preis |

        | Mindestladung | Einstellungen, Block 3 | aus (20 %, 3 h) | Schalter *An* + *Optionen* |

        | Hausspeicher und Auto | Einstellungen, Block 3 | aus (3 pro Tag) | Nur mit Hausspeicher; Schalter *An* + *Optionen* |

        | Zurück in den Solarmodus | Einstellungen, Block 3, *Ladeplan und Meldungen* | für Wallbox ausgefüllt | Setzt die Wallbox nach dem Netzladen zurück in ihren eigenen Solarmodus |

        | Telefone für Benachrichtigungen | Einstellungen, Block 3, *Ladeplan und Meldungen* | keine | Aus der Liste wählen; mit *Testbenachrichtigung senden* testen |

        | Morgenübersicht | Einstellungen, Block 3, *Ladeplan und Meldungen* | aus (06:00) | Eine Nachricht am Tag: Ladestand, nächster Plan, Sonne heute, gestern |

        | Ladekosten | Einstellungen, *Ladekosten* | Aufschlag 0, MwSt. 0, Solar-kWh gratis | Oder *Endpreis* einschalten, wenn dein Preissensor schon den vollen Preis hat |'
      grid_options:
        columns: full
    - type: markdown
      content: '### Wo du nachschaust


        - **Status** auf dem Dashboard: eine Zeile, die sagt, was HESC gerade tut und warum.

        - **Preisgrafik** (Seite *Ladeplan*): bernsteinfarben = geplant, blaugrün = günstige Gelegenheit, grau = erwarteter Preis.

        - **Hinweiszeile** (oben auf der Übersicht): *✓ Keine Hinweise* oder was Aufmerksamkeit braucht. Rot = das Ladeziel ist in Gefahr (auch auf deinem Telefon), orange = ein Sensor fehlt, aber HESC arbeitet weiter, grau = nur zur Info. Tippe darauf, um dorthin zu gehen, wo du handeln kannst.

        - **Erwartete Ladekosten** (Anzeige oben auf der Übersicht): was der aktive Plan voraussichtlich kostet.

        - **Kosten** (Anzeige oben auf der Übersicht): was ins Auto ging, von der Sonne und aus dem Netz, und was es gekostet hat.

        - **Prüfung der Einrichtung** (Seite *Einstellungen*): eine Zeile pro Teil mit Haken und den aktuellen Werten. Stimmt etwas nicht, öffnet sich dieser Teil von selbst und sagt, was fehlt.

        - **Bericht**: alles, was HESC gemessen und entschieden hat, für dich selbst oder wenn du um Hilfe bittest.


        Siehe auch: [So funktioniert es](https://github.com/satscan1/hesc-home-ev-solar-control/blob/main/docs/04-how-it-works.de.md) für die Details und [Ein Tag mit HESC](https://github.com/satscan1/hesc-home-ev-solar-control/blob/main/docs/08-a-day-with-hesc.de.md) für einen Beispieltag.'
      grid_options:
        columns: full
