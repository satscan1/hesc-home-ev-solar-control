    - type: markdown
      grid_options:
        columns: 12
        rows: auto
      content: '{%- set ok = ''<ha-icon icon="hesc:vinkje-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' -%}{%- set no = ''<ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' -%}{%- set off = ''<ha-icon icon="mdi:circle-outline" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' -%}{%- set warn = ''<ha-icon icon="hesc:waarschuwing" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' -%}

        {%- macro exists(e) -%}{{ e not in ['''', ''unknown'', ''unavailable''] and state_attr(e, ''friendly_name'') is not none }}{%- endmacro -%}

        {%- macro now(e) -%}{%- set u = state_attr(e, ''unit_of_measurement'') -%}{{ states(e) }}{{ '' '' ~ u if u else '''' }}{%- endmacro -%}

        {%- macro val(e) -%}{%- set u = state_attr(e, ''unit_of_measurement'') or '''' -%}{%- set x = states(e) | float(none) -%}{{ (''%g'' | format(x | round(1 if u | lower in [''kw'', ''kwh''] else 0))) if x is not none else states(e) }}{{ '' '' ~ u if u else '''' }}{%- endmacro -%}

        {%- macro code(e) -%}<code>{{ e if e not in ['''', ''unknown''] else ''–'' }}</code>{%- endmacro -%}

        {%- set pr = state_attr(''sensor.hesc_v3_charger_profile'', ''profile'') or {} -%}

        {%- macro sug(key, good) -%}{%- if not good and (pr.get(key) or []) | count > 0 -%}<br>&nbsp;&nbsp;<ha-icon icon="hesc:lampje" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> Suggested: {{ pr.get(key) | map(''string'') | map(''regex_replace'', ''^(.*)$'', ''<code>\\1</code>'') | join('' or '') }}{%- endif -%}{%- endmacro -%}

        {%- set C = {''charger'': ''binary_sensor.hesc_v3_check_charger'', ''sources'': ''binary_sensor.hesc_v3_check_sources'', ''weather'': ''binary_sensor.hesc_v3_check_weather_station'', ''plan'': ''binary_sensor.hesc_v3_check_charge_plan'', ''kick'': ''binary_sensor.hesc_v3_check_home_battery_and_ev''} -%}

        {%- set wx = is_state(''switch.hesc_v3_use_local_weather_station'', ''on'') -%}

        {%- set kick = is_state(''switch.hesc_v3_home_battery_and_ev_kickstart'', ''on'') -%}

        {%- set minc = is_state(''switch.hesc_v3_minimum_charge'', ''on'') -%}

        {%- set used = [''charger'', ''sources'', ''plan''] + ([''weather''] if wx else []) + ([''kick''] if kick else []) -%}

        {%- set n2 = namespace(g=0) -%}{%- for k in used -%}{%- if is_state(C[k], ''on'') -%}{%- set n2.g = n2.g + 1 -%}{%- endif -%}{%- endfor -%}

        {%- set good = n2.g -%}{%- set total = used | count -%}

        {%- set unused = ([] if wx else [''weather station'']) + ([] if minc else [''minimum charge'']) + ([] if kick else [''home battery and EV'']) -%}

        {%- set conn = state_attr(''sensor.hesc_v3_setup'', ''hesc_ev_connected_sensor'') | trim -%}

        {%- set pow = state_attr(''sensor.hesc_v3_setup'', ''hesc_ev_power_sensor'') | trim -%}

        {%- set mode = state_attr(''sensor.hesc_v3_setup'', ''hesc_charger_mode_entity'') | trim -%}

        {%- set solar = (state_attr(''sensor.hesc_v3_setup'', ''hesc_charger_eco_value'') | trim).split('','') | map(''trim'') | list -%}

        {%- set pv = state_attr(''sensor.hesc_v3_setup'', ''hesc_pv_power_sensor'') | trim -%}

        {%- set grid = state_attr(''sensor.hesc_v3_setup'', ''hesc_grid_power_sensor'') | trim -%}

        {%- set fc = state_attr(''sensor.hesc_v3_setup'', ''hesc_forecast_now_sensor'') | trim -%}{%- set fa = state_attr(''sensor.hesc_v3_setup'', ''hesc_forecast_attribute'') | trim -%}

        {%- set fcw = (state_attr(fc, fa) if fa not in ['''', ''unknown''] else states(fc)) | int(0) -%}

        {%- set sa = is_state(''switch.hesc_v3_use_hpvc'', ''off'') -%}

        {%- set hpvc_ok = exists(state_attr(''sensor.hesc_v3_setup'', ''hesc_hpvc_enabled_entity'') | trim) == ''True'' -%}

        {%- set ss = state_attr(''sensor.hesc_v3_setup'', ''hesc_charger_start_stop_entity'') | trim -%}

        {%- set rs = state_attr(''sensor.hesc_v3_setup'', ''hesc_charger_resume_entity'') | trim -%}

        {%- set price = states(''text.hesc_v3_day_ahead_price_sensor'') | trim -%}

        {%- set today = state_attr(''sensor.hesc_v3_setup'', ''hesc_solar_today_sensor'') | trim -%}

        {%- set tomorrow = (state_attr(''sensor.hesc_v3_prices'', ''raw_tomorrow'') or []) | count > 0 -%}

        ## {{ ok ~ '' Setup verified · all OK'' if good == total else warn ~ '' Setup · '' ~ (total - good) ~ ('' item needs'' if total - good == 1 else '' items need'') ~ '' attention'' }}

        {%- if is_state(C.charger, ''on'') %}

        {{ ok }} **Charger** {{ pr.type if pr.get(''known'') else (pr.get(''type'') or ''type not chosen'') }} · EV {{ states(conn) }} · {{ val(pow) }} · {{ ''solar mode'' if states(mode) in solar else warn ~ '' not in solar mode ('' ~ states(mode) ~ '')'' }}

        {%- else %}

        {{ no }} **Charger** — missing: {{ state_attr(C.charger, ''missing'') }}. The fields above have opened.

        &nbsp;&nbsp;{{ ok if exists(conn) == ''True'' else no }} EV connected: {{ code(conn) }} · now {{ states(conn) }}{{ sug(''connected'', exists(conn) == ''True'') }}

        &nbsp;&nbsp;{{ ok if exists(pow) == ''True'' else no }} Charging power: {{ code(pow) }} · now {{ now(pow) }}{{ sug(''power'', exists(pow) == ''True'') }}

        &nbsp;&nbsp;{{ ok if exists(mode) == ''True'' else no }} Solar mode: {{ code(mode) }} · now {{ states(mode) }}{{ sug(''mode'', exists(mode) == ''True'') }}

        {%- endif %}

        {%- if is_state(C.sources, ''on'') %}

        {{ ok }} **Sources** PV {{ val(pv) }}{{ '' · grid '' ~ val(grid) if exists(grid) == ''True'' else '''' }} · forecast {{ fcw }} W · {{ ''no HPVC (standalone)'' if sa else ''HPVC found'' }}

        {%- else %}

        {{ no }} **Sources** — missing: {{ state_attr(C.sources, ''missing'') }}. Open “Change sources” in column 2.

        &nbsp;&nbsp;{{ ok if exists(pv) == ''True'' else no }} PV power: {{ code(pv) }} · now {{ now(pv) }}

        &nbsp;&nbsp;{{ (ok if exists(grid) == ''True'' else no) if grid not in ['''', ''unknown''] else off }} Grid power: {{ code(grid) }}{{ '' · now '' ~ now(grid) if exists(grid) == ''True'' else '' · optional'' }}

        &nbsp;&nbsp;{{ ok if exists(fc) == ''True'' else no }} Solar forecast: {{ code(fc) }}{{ '' ('' ~ fa ~ '')'' if fa not in ['''', ''unknown''] else '''' }} · now {{ fcw }} W

        {%- if not sa %}

        &nbsp;&nbsp;{{ ok if hpvc_ok else no }} HPVC: {{ ''found'' if hpvc_ok else ''not found — is Home PV Control installed?'' }}

        {%- endif %}

        {%- endif %}

        {%- if wx %}

        {%- if is_state(C.weather, ''on'') %}

        {{ ok }} **Weather station** {{ val(state_attr(''sensor.hesc_v3_setup'', ''hesc_irradiance_sensor'') | trim) }}

        {%- else %}

        {{ no }} **Weather station** — missing: {{ state_attr(C.weather, ''missing'') }}. Its settings in column 2 have opened.

        {%- endif %}

        {%- endif %}

        {%- if is_state(C.plan, ''on'') %}

        {{ ok }} **Charge plan** price now {{ (states(''sensor.hesc_v3_prices'') | float(0) * 100) | round(1) }} {{ (state_attr(''sensor.hesc_v3_prices'', ''minor'') or ''ct'') }} · tomorrow {{ ''known'' if tomorrow else ''not yet'' }} · sun today {{ states(today) | float(0) | round(0) | int }} kWh{{ ('' · minimum '' ~ states(''number.hesc_v3_minimum_charge_level'') | int ~ ''% within '' ~ states(''number.hesc_v3_minimum_charge_within'') | int ~ '' h'') if minc else '''' }}

        {%- else %}

        {{ no }} **Charge plan** — missing: {{ state_attr(C.plan, ''missing'') }}. The Plan and notifications settings in column 3 have opened.

        &nbsp;&nbsp;{{ ok if exists(ss) == ''True'' else off }} Start/stop switch: {{ code(ss) }} · now {{ states(ss) }}

        &nbsp;&nbsp;{{ ok if exists(rs) == ''True'' else off }} Back to solar mode: {{ code(rs) }}

        &nbsp;&nbsp;{{ ok if exists(price) == ''True'' and state_attr(price, ''raw_today'') is not none else no }} Price sensor: {{ code(price) }}

        &nbsp;&nbsp;{{ ok if exists(today) == ''True'' else no }} Solar forecast today: {{ code(today) }}

        {%- endif %}

        {%- if kick %}

        {%- if is_state(C.kick, ''on'') %}

        {%- set lv = (states(''text.hesc_v3_home_battery_level_sensors'') | trim).split('','') | map(''trim'') | map(''states'') | map(''float'', none) | reject(''none'') | list -%}

        {%- set pw = (states(''text.hesc_v3_home_battery_power_sensors'') | trim).split('','') | map(''trim'') | map(''states'') | map(''float'', none) | reject(''none'') | list %}

        {{ ok }} **Home battery and EV** home batteries {{ (lv | sum / lv | count) | round(0) | int if lv | count else ''–'' }}% · {{ ''charging '' if pw | sum > 50 else ''discharging '' if pw | sum < -50 else ''idle'' }}{{ ((pw | sum) | abs | int ~ '' W'') if (pw | count and (pw | sum) | abs > 50) else '''' }}{{ ('' · EV '' ~ (states(''sensor.hesc_v3_ev_battery_level_with_fallbacks'') | float | round(0) | int) ~ ''%'') if states(''sensor.hesc_v3_ev_battery_level_with_fallbacks'') | is_number else '''' }}

        {%- else %}

        {{ no }} **Home battery and EV** — missing: {{ state_attr(C.kick, ''missing'') }}. Its settings in column 3 have opened.

        {%- endif %}

        {%- endif %}

        {%- if unused | count %}

        {{ off }} Not used: {{ unused | join('', '') }}

        {%- endif %}

        **Now:** {{ states(''sensor.hesc_v3_state'') }} · {{ states(''sensor.hesc_v3_charge_plan_status'') }}{{ '' · '' ~ states(''sensor.hesc_v3_home_battery_and_ev_status'') if kick and states(''sensor.hesc_v3_home_battery_and_ev_status'') not in [states(''sensor.hesc_v3_charge_plan_status''), ''Off'', ''Waiting''] else '''' }}

        '
    - type: vertical-stack
      grid_options:
        columns: 12
      cards:
      - type: custom:hesc-style
        style: 'ha-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }'
        visibility:
        - condition: state
          entity: switch.hesc_v3_use_hpvc
          state: 'on'
        card:
          type: tile
          entity: switch.hesc_v3_apply_advice_automatically
          name: Apply advice automatically
          icon: mdi:auto-fix
          hide_state: true
          vertical: false
          features_position: inline
          features:
          - type: toggle
      - type: custom:hesc-style
        style: 'ha-card { border-top-left-radius: 0; border-top-right-radius: 0; } ha-markdown { padding: 8px 16px 12px !important; line-height: 1.45; }'
        card:
          type: markdown
          content: '{%- set a = ''sensor.hesc_v3_advised_start_threshold'' -%}

            {%- set s = states(a) -%}

            {%- set f = ''{:,.0f}'' -%}

            {%- set upd = (as_timestamp(state_attr(a, ''updated'')) | timestamp_custom(''%a %H:%M'')) if state_attr(a, ''updated'') else ''–'' -%}

            {%- if s in [''unknown'', ''unavailable''] -%}

            <font color="#94a3b8">Working it out…</font>

            {%- else -%}

            {%- set l1 = ''**Now** '' ~ f.format(states(''number.hesc_v3_forecast_power_to_start'') | float(0)) ~ '' / '' ~ f.format(states(''number.hesc_v3_forecast_power_to_hold'') | float(0)) ~ '' W'' ~ (('' · **Advice** '' ~ f.format(state_attr(a, ''advised_start'')) ~ '' / '' ~ f.format(state_attr(a, ''advised_hold'')) ~ '' W'') if state_attr(a, ''advised_start'') else '''') -%}

            {%- set l2 = ''**Based on** '' ~ (state_attr(a, ''sun_sessions'') if state_attr(a, ''method'') == ''sun_share'' else state_attr(a, ''good_sessions'')) ~ '' sessions ('' ~ state_attr(a, ''days'') ~ '' days)'' ~ (('' · need '' ~ state_attr(a, ''need_sessions'') ~ '' on '' ~ state_attr(a, ''need_days'') ~ '' days'') if s == ''collecting'' else '''') -%}

            {%- set l3 = (''**Sun share** '' ~ state_attr(a, ''sun_share_above'') ~ ''% from the advice up · '' ~ state_attr(a, ''sun_share_below'') ~ ''% below (goal '' ~ state_attr(a, ''sun_target'') ~ ''%)'') if state_attr(a, ''method'') == ''sun_share'' and state_attr(a, ''sun_share_below'') is not none else ((''**Forecast** at start '' ~ f.format(state_attr(a, ''lowest_good_forecast'')) ~ '' – '' ~ f.format(state_attr(a, ''median_good_forecast'')) ~ '' W'') if state_attr(a, ''lowest_good_forecast'') else '''') -%}

            {%- set l4 = ''**Auto** '' ~ (''on'' if is_state(''switch.hesc_v3_apply_advice_automatically'', ''on'') else ''off'') ~ '' (checked '' ~ upd ~ '')'' ~ (('' · last '' ~ state_attr(a, ''last_change'')) if state_attr(a, ''last_change'') else '''') ~ (('' · next step from '' ~ (as_timestamp(state_attr(a, ''next_step_from'')) | timestamp_custom(''%a %d %b''))) if state_attr(a, ''next_step_from'') else '''') ~ ('' · seasonal on'' if is_state(''switch.hesc_v3_seasonal_start_threshold'', ''on'') else '''') -%}

            {%- set sa = is_state(''switch.hesc_v3_use_hpvc'', ''off'') -%}

            {%- set l2 = (state_attr(a, ''status_text'') or '''') if sa else l2 -%}

            {%- set l3 = '''' if sa else l3 -%}

            {%- set l4 = (''**Seasonal** on'' if is_state(''switch.hesc_v3_seasonal_start_threshold'', ''on'') else '''') if sa else l4 -%}

            {%- set pa = ''sensor.hesc_v3_phase_advice'' -%}

            {%- set l5 = (''**Phases** ('' ~ states(pa) | replace(''_'', '' '') ~ '') '' ~ state_attr(pa, ''text'')) if state_attr(pa, ''text'') and states(pa) not in [''unknown'', ''unavailable''] else '''' -%}

            {{ [l1, l2, l3, l4, l5] | reject(''eq'', '''') | join(''<br>'') }}

            {%- endif -%}'
    - type: custom:hesc-style
      style:
        .: 'ha-card { height: 100%; }'
        ha-markdown$: 'h2 ha-icon { --mdc-icon-size: 24px; margin-right: 4px; }

