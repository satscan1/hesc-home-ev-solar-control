              h2 a ha-icon { --mdc-icon-size: 20px; margin-right: 0; vertical-align: 1px; }

              h2 ha-icon[icon="hesc:ev-zon"] { vertical-align: 4.8px; }'
          card:
            type: markdown
            content: '{%- set setup_ok = is_state(''sensor.hesc_v3_setup'', ''ok'') and is_state(''binary_sensor.hesc_v3_configuration_valid'', ''on'') -%}

              {%- set inputs_ok = is_state(''binary_sensor.hesc_v3_inputs_valid'', ''on'') -%}

              {%- set n = states(''sensor.hesc_v3_notice'') -%}

              {%- set p = state_attr(''sensor.hesc_v3_notice'', ''prio'') | int(2) -%}

              ## <ha-icon icon="hesc:ev-zon"></ha-icon> HESC


              <font size="5">{{ ''<ha-icon icon="hesc:vinkje-cirkel" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#22c55e"></ha-icon>Setup OK'' if setup_ok else ''<ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#ef4444"></ha-icon>Setup needs attention'' }}</font>


              <font size="5">{{ ''<ha-icon icon="hesc:vinkje-cirkel" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#22c55e"></ha-icon>Inputs OK'' if inputs_ok else ''<ha-icon icon="hesc:waarschuwing" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#fbbf24"></ha-icon>Inputs missing'' }}</font>


              <font size="5">{{ ''<ha-icon icon="hesc:vinkje-cirkel" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#22c55e"></ha-icon>No notices'' if n in [''none'', ''unknown'', ''unavailable'', ''''] else ((''<ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#ef4444"></ha-icon>'' if p == 1 else ''<ha-icon icon="hesc:waarschuwing" style="--mdc-icon-size:28px;vertical-align:-7px;margin-right:8px;color:#fbbf24"></ha-icon>'') ~ n) }}</font>


              Now: **{{ states(''sensor.hesc_v3_state'') }}** · EV **{{ states(''sensor.hesc_v3_ev_battery_level_with_fallbacks'') }} %**'
    - type: custom:hesc-style
      style:
        ha-markdown$: 'h2 ha-icon { --mdc-icon-size: 24px; margin-right: 4px; }

          h2 a ha-icon { --mdc-icon-size: 20px; margin-right: 0; vertical-align: 1px; }

          h2 ha-icon[icon="hesc:kalender"] { vertical-align: 3.5px; }'
      grid_options:
        columns: full
      card:
        type: markdown
        text_only: true
        content: '## <ha-icon icon="hesc:kalender"></ha-icon> Charge plan'
    - type: custom:hesc-style
      style: '#root { align-items: stretch !important; } #root > *:first-child > * { flex: 2 1 0 !important; min-width: 0; } #root > *:last-child > * { flex: 1 1 0 !important; min-width: 0; }'
      grid_options:
        columns: full
      card:
        type: horizontal-stack
        cards:
        - type: custom:hesc-style
          style: 'ha-card { height: 100%; }'
          grid_options:
            columns: 18
            rows: auto
          card:
            type: markdown
            content: '{%- set cheap_on = is_state(''switch.hesc_v3_charge_plan_take_cheap_chances'', ''on'') -%}{%- set r = state_attr(''sensor.hesc_v3_charge_plan'', ''plan'') -%}{%- set p = r if r is mapping else (r | from_json if r else {}) -%}

              {%- set on = p.active | default(false) -%}

              {%- set q = p.quarters | default(0) -%}

              {%- set st = states(''sensor.hesc_v3_charge_plan_status'') -%}

              {%- set solo = st.startswith(''EV already charging'') -%}

              {% if on or st != ''No active plan'' %}<ha-alert alert-type="info">{{ ''EV is already charging by itself (e.g. on solar). The plan watches and does not take over. Need full power now? Start it in your charger app.'' if solo else (''Planned: waiting for the first planned quarter'' if (st.startswith(''Finished'') and q > 0) else st) }}</ha-alert>{% endif %}


              {% if on %}<center><b>ACTIVE PLAN</b> · ready by <b>{{ p.deadline_text | default(''–'') }}</b>{{ '' (weekly schedule)'' if p.get(''source'') == ''repeating'' else '' (fixed day per week)'' }}</center>


              | CHARGING TIME | ENERGY PRICE | EXPECTED COST |{{ '' CHEAP CHANCES |'' if cheap_on else '''' }}

              |:--|--:|--:|{{ ''--:|'' if cheap_on else '''' }}

              | <font size="6" color="#22c55e"><b>{{ ''–'' if solo else (p.charge_time | default(''–'') ~ '' h'') }}</b></font> @ {{ p.kw | default(''–'') }} kW | <font size="6" color="#22c55e"><b>{{ (p.avg_price_ct | string | replace(''.'', state_attr(''sensor.hesc_v3_prices'', ''decimal'') or '','')) ~ '' '' ~ (state_attr(''sensor.hesc_v3_prices'', ''minor'') or ''ct'') ~ ''/kWh'' if (p.avg_price_ct is not none and q > 0 and not solo) else ''–'' }}</b></font> | <font size="6" color="#22c55e"><b>{{ (state_attr(''sensor.hesc_v3_expected_charge_cost'', ''display'') or ''–'') if (q > 0 and not solo) else ''–'' }}</b></font> |{{ ('' <font size="5" color="#a855f7"><b>≤ '' ~ ((states(''number.hesc_v3_charge_plan_opportunity_price'') | float(0) * 100) | round(1) | string | replace(''.'', state_attr(''sensor.hesc_v3_prices'', ''decimal'') or '','')) ~ '' '' ~ (state_attr(''sensor.hesc_v3_prices'', ''minor'') or ''ct'') ~ ''/kWh</b></font> |'') if cheap_on else '''' }}


              | BATTERY NOW | GOAL | STILL NEEDED | STATUS |

              |:--|:--|:--|:--|

              | <font size="4"><b>{{ (p.soc | round(0) | int ~ ''%'') if p.soc is not none else ''?'' }}</b></font> | <font size="4"><b>{{ p.goal | default(''–'') }}%</b></font> | <font size="4"><b>{{ p.need_kwh | default(0) }} kWh</b></font>{{ '' (<ha-icon icon="hesc:zon" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>~'' ~ p.solar_kwh ~ '' kWh sun)'' if (p.solar_kwh | default(0)) > 0 else '''' }}{{ '''' if solo else ('' · '' ~ (p.quarters | default(0)) ~ '' × 15 min grid'') }}{{ '' · <ha-icon icon="hesc:waarschuwing" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>not enough time left for the goal'' if (on and not solo and (p.short_of_time | default(false))) else '''' }} | <font size="4" color="{{ ''#22c55e'' if on else ''#cbd5e1'' }}"><b>{{ ''<ha-icon icon="hesc:vinkje-cirkel" style="--mdc-icon-size:20px;vertical-align:-4px;margin-right:4px"></ha-icon>already there'' if (p.need_kwh is defined and p.need_kwh == 0 and p.soc is not none) else (''<ha-icon icon="hesc:zon" style="--mdc-icon-size:20px;vertical-align:-4px;margin-right:4px"></ha-icon>charging by itself'' if (on and solo) else (''<ha-icon icon="hesc:zandloper" style="--mdc-icon-size:20px;vertical-align:-4px;margin-right:4px"></ha-icon>planned'' if p.quarters | default(0) > 0 else ''–'')) }}</b></font> |

              {%- if p.prices_complete is defined and not p.prices_complete %}


              <small><ha-icon icon="hesc:info" style="--mdc-icon-size:14px;vertical-align:-2px;margin-right:4px"></ha-icon>Prices known until {{ as_timestamp(p.prices_until) | timestamp_custom(''%a %H:%M'') if p.prices_until else ''–'' }}. Final plan follows when all prices up to departure are known.</small>

              {%- endif %}{% else %}


              <center><b>No charging plan active</b></center>{% endif %}'
        - type: custom:hesc-style
          style:
            ha-markdown$: 'table { width: 100%; }

              thead { display: none; }

              h2 ha-icon { --mdc-icon-size: 24px; margin-right: 4px; }

              h2 a ha-icon { --mdc-icon-size: 20px; margin-right: 0; vertical-align: 1px; }

              h2 ha-icon[icon="hesc:laadstekker"] { vertical-align: 4px; }'
            .: 'ha-card { height: 100%; }'
          card:
            type: markdown
            content: '## <ha-icon icon="hesc:laadstekker"></ha-icon> Live Inputs


              {% macro w(e) -%}{%- set v = states(e) -%}{{ (v | float | round(0) | int) ~ '' W'' if v | is_number else ''–'' }}{%- endmacro -%}

              {%- set soc = states(''sensor.hesc_v3_ev_battery_level_with_fallbacks'') -%}

              {%- set src = state_attr(''sensor.hesc_v3_ev_battery_level_with_fallbacks'', ''source_name'') -%}

              {%- set est = state_attr(''sensor.hesc_v3_ev_battery_level_with_fallbacks'', ''estimated'') -%}

              {%- set sun = states(''sensor.hesc_v3_solar_still_to_come_today'') -%}

              | | |

              |:--|--:|

              | **Expected charge cost** | [{{ ''no active plan'' if state_attr(''sensor.hesc_v3_expected_charge_cost'', ''ready_by'') == ''no active plan'' else (state_attr(''sensor.hesc_v3_expected_charge_cost'', ''display'') or ''–'') }}](/hesc-v3/costs){{ '' · '' ~ state_attr(''sensor.hesc_v3_expected_charge_cost'', ''grid_kwh'') ~ '' kWh'' if state_attr(''sensor.hesc_v3_expected_charge_cost'', ''grid_kwh'') and not state_attr(''sensor.hesc_v3_expected_charge_cost'', ''ready_by'') == ''no active plan'' }} |

              | **Forecast now** | {{ w(''sensor.hesc_v3_forecast_power_diagnostic'') }} · cautious {{ w(''sensor.hesc_v3_forecast_power_cautious_diagnostic'') }} |

              | **Actual PV** | {{ w(''sensor.hesc_v3_pv_power_diagnostic'') }} |

              | **EV charging power** | {{ w(''sensor.hesc_v3_charging_power_diagnostic'') }} |

              | **EV battery level** | {{ (soc | float | round(0) | int) ~ '' %'' if soc | is_number else ''–'' }}{{ '' (estimated)'' if est }}{{ '' · '' ~ src if src }} |

              {%- if is_state(''switch.hesc_v3_use_local_weather_station'', ''on'') %}

              | **Irradiance** | {{ (states(''sensor.hesc_v3_irradiance_diagnostic'') | float | round(0) | int) ~ '' W/m²'' if states(''sensor.hesc_v3_irradiance_diagnostic'') | is_number else ''–'' }} |

              {%- endif %}

              | **Solar still to come today** | {{ (sun | float | round(1)) ~ '' kWh'' if sun | is_number else ''–'' }} |'
