title: HESC v3
views:
- type: sections
  title: Main
  path: home-ev-solar-control
  icon: hesc:ev-zon
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.hesc_v3_state
    name: HESC Status
    show_name: true
    show_state: true
    show_icon: true
    icon: hesc:ev-zon
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: entity
    entity: binary_sensor.hesc_v3_ev_connected_diagnostic
    name: EV
    show_name: true
    show_state: true
    show_icon: true
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: entity
    entity: binary_sensor.hesc_v3_charger_in_solar_mode_diagnostic
    name: Solar mode
    show_name: true
    show_state: true
    show_icon: true
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: entity
    entity: sensor.hesc_v3_expected_charge_cost
    name: Expected charge cost
    show_name: true
    show_state: true
    show_icon: true
    icon: hesc:euro-klok
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
    state_content: display
  - type: entity
    entity: binary_sensor.hpvc_pv_limited
    name: HPVC limiting
    show_name: true
    show_state: true
    show_icon: true
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
    - condition: state
      entity: switch.hesc_v3_use_hpvc
      state: 'on'
  - type: entity
    entity: binary_sensor.hesc_v3_release_active_diagnostic
    name: Release
    show_name: true
    show_state: true
    show_icon: true
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_release_active_diagnostic
      state: 'on'
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: entity
    entity: switch.hesc_v3_charging_costs_page
    name: Costs
    show_name: true
    show_state: false
    show_icon: true
    icon: hesc:euro
    color: green
    tap_action:
      action: navigate
      navigation_path: /hesc-v3/costs
    visibility:
    - condition: state
      entity: switch.hesc_v3_charging_costs_page
      state: 'on'
  - type: entity
    entity: sensor.hesc_v3_charge_plan
    name: Guide
    show_name: true
    show_state: false
    show_icon: true
    icon: hesc:boek
    color: blue
    tap_action:
      action: navigate
      navigation_path: /hesc-v3/guide
    hold_action:
      action: navigate
      navigation_path: /hesc-v3/guide-nl
  sections:
  - type: grid
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state_not: 'on'
    cards:
    - type: markdown
      grid_options:
        columns: 12
      content: '{%- set sa = is_state(''switch.hesc_v3_use_hpvc'', ''off'') -%}

        <ha-alert title="Welcome to Home EV Solar Control" alert-type="info">First fill in the essentials on the <b>Settings</b> tab: only three things about your charger. {{ ''Also pick your PV and grid power sensors there; everything else has a good default.'' if sa else ''Everything else is taken over from Home PV Control or has a good default.'' }} The dashboard appears as soon as HESC has what it needs.</ha-alert>


        {%- macro exists(e) -%}{{ e not in ['''', ''unknown'', ''unavailable''] and (states(e) != ''unknown'' or state_attr(e, ''friendly_name'') is not none) }}{%- endmacro -%}

        {%- macro now(e) -%}{%- set u = state_attr(e, ''unit_of_measurement'') -%}{{ states(e) }}{{ '' '' ~ u if u else '''' }}{%- endmacro -%}

        {%- set conn = state_attr(''sensor.hesc_v3_setup'', ''hesc_ev_connected_sensor'') | trim -%}

        {%- set pow = state_attr(''sensor.hesc_v3_setup'', ''hesc_ev_power_sensor'') | trim -%}

        {%- set mode = state_attr(''sensor.hesc_v3_setup'', ''hesc_charger_mode_entity'') | trim -%}

        {%- set solar = state_attr(''sensor.hesc_v3_setup'', ''hesc_charger_eco_value'') | trim -%}

        {%- set solar_ok = solar not in ['''', ''unknown'', ''unavailable''] -%}

        {%- set in_solar = states(mode) in (solar.split('','') | map(''trim'') | list) -%}

        {%- set pv = state_attr(''sensor.hesc_v3_setup'', ''hesc_pv_power_sensor'') | trim -%}

        {%- set grid = state_attr(''sensor.hesc_v3_setup'', ''hesc_grid_power_sensor'') | trim -%}

        {%- set fc = state_attr(''sensor.hesc_v3_setup'', ''hesc_forecast_now_sensor'') | trim -%}

        {%- set fa = state_attr(''sensor.hesc_v3_setup'', ''hesc_forecast_attribute'') | trim -%}

        {%- set hen = state_attr(''sensor.hesc_v3_setup'', ''hesc_hpvc_enabled_entity'') | trim -%}

        {%- set hlim = state_attr(''sensor.hesc_v3_setup'', ''hesc_hpvc_limited_entity'') | trim -%}

        {%- set from_hpvc = is_state(''binary_sensor.hesc_v3_setup_pv_and_grid_from_hpvc'', ''on'') -%}

        {%- set req = [exists(conn) == ''True'', exists(pow) == ''True'', exists(mode) == ''True'' and solar_ok] -%}

        {%- set done = req | select | list | count -%}

        {%- set ok = ''<ha-icon icon="hesc:vinkje-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' -%}{%- set no = ''<ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' -%}

        {%- set pr = state_attr(''sensor.hesc_v3_charger_profile'', ''profile'') or {} -%}

        {%- macro sug(key, good) -%}{%- if not good and (pr.get(key) or []) | count > 0 -%}<br>&nbsp;&nbsp;<ha-icon icon="hesc:lampje" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> Suggested: {{ pr.get(key) | map(''string'') | map(''regex_replace'', ''^(.*)$'', ''<code>\\1</code>'') | join('' or '') }}{%- endif -%}{%- endmacro -%}

        **Your charger ({{ done }} of 3 done)**

        <ha-icon icon="hesc:laadstekker" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> **Charger type**: {{ (pr.type ~ ('' · tested'' if pr.tested else '' · not tested yet, check it in shadow mode'') ~ ('' · '' ~ pr.note if pr.note else '''')) if pr.get(''known'') else (''Other: fill in the fields yourself'' if pr.get(''type'') == ''Other (manual)'' else ''pick your charger above, HESC then fills in what it can'') }}

        {{ ok if req[0] else no }} **EV connected**: {{ ''<code>'' ~ conn ~ ''</code> · now '' ~ states(conn) if req[0] else ''pick the sensor that shows the car is plugged in'' }}{{ sug(''connected'', req[0]) }}

        {{ ok if req[1] else no }} **Charging power**: {{ ''<code>'' ~ pow ~ ''</code> · now '' ~ now(pow) if req[1] else ''pick the sensor with the charging power (W or kW)'' }}{{ sug(''power'', req[1]) }}

        {{ ok if req[2] else no }} **Solar mode**: {{ ''<code>'' ~ mode ~ ''</code> = <code>'' ~ solar ~ ''</code> · now '' ~ states(mode) ~ ('' (solar mode)'' if in_solar else '''') if req[2] else ''pick the charger mode entity and the value that means solar charging'' }}{{ sug(''mode'', req[2]) }}


        **{{ ''Sources'' if sa else ''Taken over automatically'' }}**

        {{ ok if exists(pv) == ''True'' else no }} **PV power**: <code>{{ pv or ''–'' }}</code>{{ '' (from HPVC)'' if from_hpvc else '''' }} · now {{ now(pv) }}

        {{ ok if exists(grid) == ''True'' else ''<ha-icon icon="mdi:circle-outline" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>'' }} **Grid power**: <code>{{ grid or ''–'' }}</code>{{ '' (from HPVC)'' if from_hpvc else '''' }}{{ '' · now '' ~ now(grid) if exists(grid) == ''True'' else '' · optional'' }}

        {{ ok if exists(fc) == ''True'' else no }} **Solar forecast**: <code>{{ fc or ''–'' }}</code>{{ '' ('' ~ fa ~ '')'' if fa else '''' }} · now {{ state_attr(fc, fa) if fa else states(fc) }} W

        {%- if not sa %}{{ ok if exists(hen) == ''True'' and exists(hlim) == ''True'' else no }} **HPVC**: {{ ''found'' if exists(hen) == ''True'' and exists(hlim) == ''True'' else ''not found — is Home PV Control installed?'' }}{% endif %}


        [<ha-icon icon="hesc:schuifregelaars" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> Open Settings](/hesc-v3/settings)'
  - type: grid
    cards:
    - type: custom:hesc-style
      style:
        ha-markdown$: 'h2 ha-icon { --mdc-icon-size: 24px; margin-right: 4px; }

          h2 a ha-icon { --mdc-icon-size: 20px; margin-right: 0; vertical-align: 1px; }

          h2 ha-icon[icon="hesc:laadpaal"] { vertical-align: 4px; }'
      grid_options:
        columns: 12
        rows: auto
      card:
        type: markdown
        content: '## <ha-icon icon="hesc:laadpaal"></ha-icon> EV Solar Master Control <small>· HESC v3</small> <a href="/hesc-v3/guide" title="Guide: how smart charging works"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:20px;color:#8ab4f8;vertical-align:-2px"></ha-icon></a>

          <small>Starts solar charging on forecast sun by asking HPVC for a temporary PV release (HPVC 1.5.1 or newer). Shadow mode: only evaluates, never asks.</small>'
    - type: tile
      entity: switch.hesc_v3_hesc_enabled
      name: Enable HESC
      icon: hesc:zon
      hide_state: true
      vertical: false
      features_position: inline
      features:
      - type: toggle
    - type: tile
      entity: switch.hesc_v3_shadow_mode
      name: Shadow mode (evaluate only)
      icon: mdi:ghost-outline
      hide_state: true
      vertical: false
      features_position: inline
      features:
      - type: toggle
    - type: conditional
      conditions:
      - entity: binary_sensor.hpvc_external_release_active
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.hpvc_external_release_active
        name: HPVC released PV
        icon: mdi:solar-power-variant
        color: green
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: grid
    cards:
    - type: custom:hesc-style
      style:
        ha-markdown$: 'table { width: 100%; }

          thead { display: none; }

          h2 ha-icon { --mdc-icon-size: 24px; margin-right: 4px; }

          h2 a ha-icon { --mdc-icon-size: 20px; margin-right: 0; vertical-align: 1px; }

          h2 ha-icon[icon="hesc:staafdiagram"] { vertical-align: 2.4px; }'
        .: 'ha-card { min-height: 187px; }'
      grid_options:
        columns: full
        rows: auto
      card:
        type: markdown
        content: '## <ha-icon icon="hesc:staafdiagram"></ha-icon> Status


          {% set st = states(''sensor.hesc_v3_state'') %}

          {% set rs = states(''sensor.hesc_v3_reason'') %}

          {% set la = states(''sensor.hesc_v3_last_action'') %}

          {% set lae = states.sensor.hesc_v3_last_action %}

          {% set la_h = ((now() - lae.last_changed).total_seconds() / 3600) if lae else 999 %}

          {% set la_d = (lae.last_changed | as_local).date() if lae else none %}

          {% set la_day = '''' if (la_d is none or la_d == now().date()) else (''yesterday '' if la_d == (now() - timedelta(days=1)).date() else (lae.last_changed | as_local).strftime(''%a '')) %}

          {% set i1 = states(''sensor.hesc_v3_today'') %}

          {% set i2 = states(''sensor.hesc_v3_accuracy_today'') %}

          {% set adv = states(''sensor.hesc_v3_advice'') %}

          {% set r = i1 | regex_findall(''(\\d+) releases \\((\\d+) ok, (\\d+) failed\\)'') %}

          {% set ses = i1 | regex_findall(''(\\d+) solar sessions'') %}

          {% set col = adv | regex_findall(''(\\d+) of (\\d+)'') %}

          | | |

          |:--|:--|

          | **State** | {{ st.replace(''[shadow] '', '''') }}{{ '' · '' ~ rs if rs not in ['''', ''unknown'', ''unavailable''] }}{{ '' · shadow'' if st.startswith(''[shadow]'') }} |

          {%- if la not in ['''', ''unknown'', ''unavailable''] and la_h <= 36 %}

          | **Last action** | {{ la_day }}{{ la }} |

          {%- endif %}

          | **Today** | {{ ses[0] if ses else 0 }} solar sessions · {{ r[0][0] if r else 0 }} HPVC releases{{ '' ('' ~ r[0][2] ~ '' failed)'' if r and r[0][2] | int > 0 }} |

          | **Advice** | {% set ad = states.sensor.hesc_v3_advised_start_threshold -%}{%- set aa = ad.attributes if ad else {} -%}{%- set f = ''{:,}'' -%}{%- if ad and ad.state | is_number and aa.advised_start is number -%}[{{ f.format(aa.advised_start | int) }} / {{ f.format(aa.advised_hold | int) }} W](/hesc-v3/settings) · now {{ f.format(aa.current_start | int) }} / {{ f.format(aa.current_hold | int) }} W{%- if aa.get(''auto'') -%}{%- set tx = aa.get(''status_text'') or '''' -%}{{ '' · auto'' }}{{ ('', next step from '' ~ (tx.split('' from '') | last).rstrip(''.'')) if '' from '' in tx }}{%- endif -%}{%- elif ad and aa.get(''status_text'') -%}{{ (''Collecting: '' ~ aa.get(''good_sessions'') ~ '' of '' ~ aa.get(''need_sessions'') ~ '' sessions while HPVC limited · '' ~ aa.get(''days'') ~ '' of '' ~ aa.get(''need_days'') ~ '' days'') if ad.state == ''collecting'' and aa.get(''status_text'', '''').startswith(''Collecting'') else aa.get(''status_text'') }}{%- else -%}{% if col %}not yet · {{ col[0][1] | int - col[0][0] | int }} more solar sessions needed{% elif adv in ['''', ''unknown'', ''unavailable''] %}–{% else %}available · see report{% endif %}{%- endif %} |'
    - type: conditional
      conditions:
      - entity: binary_sensor.hesc_v3_report_ready
        state: 'off'
      card:
        type: tile
        entity: button.hesc_v3_generate_report
        name: Generate report
        icon: mdi:file-document-plus-outline
        color: blue
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.hesc_v3_generate_report
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.hesc_v3_generate_report
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - entity: binary_sensor.hesc_v3_report_ready
        state: 'on'
      card:
        type: tile
        entity: binary_sensor.hesc_v3_report_ready
        name: View report
        icon: mdi:file-document-check-outline
        color: green
        state_content: []
        hide_state: true
        tap_action:
          action: url
          url_path: /local/hesc_v3/open.html
        icon_tap_action:
          action: url
          url_path: /local/hesc_v3/open.html
        grid_options:
          columns: 6
      grid_options:
        columns: 12
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: grid
    cards:
    - type: custom:hesc-style
      style:
        ha-markdown$: 'table { width: 100%; }

          thead { display: none; }

          h2 ha-icon { --mdc-icon-size: 24px; margin-right: 4px; }

          h2 a ha-icon { --mdc-icon-size: 20px; margin-right: 0; vertical-align: 1px; }

          h2 ha-icon[icon="hesc:laadstekker"] { vertical-align: 4px; }

          td { padding-top: 2px !important; padding-bottom: 2px !important; }'
        .: 'ha-card { min-height: 250px; }'
      grid_options:
        columns: full
        rows: auto
      card:
        type: markdown
        content: '## <ha-icon icon="hesc:laadstekker"></ha-icon> Live

          {%- set su = states.sensor.hesc_v3_setup.attributes if states.sensor.hesc_v3_setup else {} -%}

          {%- set sign = 1 if su.get(''hesc_grid_export_positive'') == ''on'' else -1 -%}

          {%- macro flow(v, sign) -%}{%- if v | is_number -%}{%- set x = v | float * sign -%}{{ x | abs | round(0) | int }} W {{ ''export'' if x > 0 else ''import'' }}{%- else -%}–{%- endif -%}{%- endmacro -%}

          {%- set pw = namespace(sum=0, n=0) -%}

          {%- for e in states(''text.hesc_v3_home_battery_power_sensors'').split('','') | map(''trim'') | reject(''eq'', '''') -%}

          {%- if states(e) | is_number -%}{%- set pw.sum = pw.sum + states(e) | float -%}{%- set pw.n = pw.n + 1 -%}{%- endif -%}

          {%- endfor -%}

          {%- set sc = namespace(sum=0, n=0) -%}

          {%- for e in states(''text.hesc_v3_home_battery_level_sensors'').split('','') | map(''trim'') | reject(''eq'', '''') -%}

          {%- if states(e) | is_number -%}{%- set sc.sum = sc.sum + states(e) | float -%}{%- set sc.n = sc.n + 1 -%}{%- endif -%}

          {%- endfor -%}

          {%- set soc = states(''sensor.hesc_v3_ev_battery_level_with_fallbacks'') -%}

          {%- set src = state_attr(''sensor.hesc_v3_ev_battery_level_with_fallbacks'', ''source_name'') -%}

          {%- set est = state_attr(''sensor.hesc_v3_ev_battery_level_with_fallbacks'', ''estimated'') -%}

          {%- set full = states(''number.hesc_v3_ev_full_at_battery_level'') -%}

          {%- set sun = states(''sensor.hesc_v3_solar_still_to_come_today'') -%}

          {%- set raw = states(''sensor.hesc_v3_prices'') -%}

          {%- set pa = states.sensor.hesc_v3_prices.attributes if states.sensor.hesc_v3_prices else {} -%}

          {%- set allin = is_state(''switch.hesc_v3_costs_price_is_all_in'', ''on'') -%}

          {%- set mk = states(''number.hesc_v3_costs_mark_up_per_kwh_energy_tax_supplier'') | float(0) -%}

          {%- set vat = states(''number.hesc_v3_costs_vat'') | float(0) -%}

          {%- macro money(v, pa) -%}{%- set t = ''%.2f'' | format(v) -%}{%- set t = t.replace(''.'', '','') if pa.get(''decimal'', '','') != ''.'' else t -%}{{ (t ~ '' '' ~ pa.get(''symbol'', ''€'')) if pa.get(''symbol_after'') in [true, ''true'', ''True''] else (pa.get(''symbol'', ''€'') ~ '' '' ~ t) }}{%- endmacro %}

          {%- set fk = {''estimate'': ''pv_estimate'', ''estimate10'': ''pv_estimate10'', ''estimate90'': ''pv_estimate90''}.get(su.get(''hesc_forecast_attribute'', '''') | trim, ''pv_estimate10'') -%}

          {%- set ps = states(''number.hesc_v3_forecast_power_to_start'') | float(2000) -%}

          {%- set fr = (state_attr(su.get(''hesc_solar_today_sensor'', '''') | trim, ''detailedForecast'') or []) + (state_attr(su.get(''hesc_solar_tomorrow_sensor'', '''') | trim, ''detailedForecast'') or []) -%}

          {%- set w = namespace(s=none, e=none, done=false) -%}

          {%- for r in fr -%}

          {%- set a = as_local(as_datetime(r.get(''period_start''))) if r.get(''period_start'') else none -%}

          {%- if a is not none and not w.done and a + timedelta(minutes=30) > now() -%}

          {%- if (r.get(fk) | float(0)) * 1000 >= ps -%}{%- if w.s is none -%}{%- set w.s = a -%}{%- endif -%}{%- set w.e = a + timedelta(minutes=30) -%}

          {%- elif w.s is not none -%}{%- set w.done = true -%}{%- endif -%}

          {%- endif -%}

          {%- endfor -%}

          {%- macro dayname(t) -%}{{ ''today'' if t.date() == now().date() else (''tomorrow'' if t.date() == (now() + timedelta(days=1)).date() else t.strftime(''%a'')) }}{%- endmacro -%}

          {%- set sunpart = (''sun now until '' ~ w.e.strftime(''%H:%M'') if w.s <= now() else ''sun '' ~ dayname(w.s) ~ '' '' ~ w.s.strftime(''%H:%M'') ~ ''–'' ~ w.e.strftime(''%H:%M'')) if w.s is not none else (''no sun to start on yet'' if fr else '''') -%}

          {%- set pl = (pa.get(''raw_today'') or []) + (pa.get(''raw_tomorrow'') or []) -%}

          {%- set pl = pl | selectattr(''end'', ''defined'') | list -%}

          {%- set fut = namespace(l=[]) -%}

          {%- for p in pl -%}{%- if as_datetime(p.end) > now() -%}{%- set fut.l = fut.l + [p] -%}{%- endif -%}{%- endfor -%}

          {%- set blk = 4 if (fut.l | count > 1 and (as_datetime(fut.l[1].start) - as_datetime(fut.l[0].start)).total_seconds() <= 900) else 1 -%}

          {%- set c = namespace(i=-1, v=999999) -%}

          {%- for i in range(0, [fut.l | count - blk + 1, 0] | max) -%}

          {%- set m = (fut.l[i:i + blk] | map(attribute=''value'') | map(''float'', 0) | sum) / blk -%}

          {%- if m < c.v -%}{%- set c.i = i -%}{%- set c.v = m -%}{%- endif -%}

          {%- endfor -%}

          {%- set cs = as_local(as_datetime(fut.l[c.i].start)) if c.i >= 0 else none -%}

          {%- set cv = (c.v if allin else (c.v + mk) * (1 + vat / 100)) if c.i >= 0 else 0 -%}

          {%- set cheappart = (''cheapest grid '' ~ dayname(cs) ~ '' '' ~ cs.strftime(''%H:%M'') ~ '' '' ~ money(cv, pa)) if cs is not none else '''' -%}

          {%- set best = sunpart if w.s is not none else (cheappart or sunpart) %}


          | | |

          |:--|--:|

          | **Grid** | {{ flow(states(su.get(''hesc_grid_power_sensor'', '''')), sign) }} |

          {%- if pw.n > 0 %}

          | **Home batteries** | {{ pw.sum | round(0) | int }} W{{ ('' · '' ~ ((sc.sum / sc.n) | round(0) | int) ~ '' %'') if sc.n > 0 else '''' }} |

          {%- endif %}

          | **EV battery level** | {{ (soc | float | round(0) | int) ~ '' %'' if soc | is_number else ''–'' }}{{ '' (estimated)'' if est }}{{ ('' · full at '' ~ (full | float | round(0) | int) ~ '' %'') if full | is_number }}{{ '' · '' ~ src if src }} |

          {%- if raw | is_number %}

          | **Energy price now** | {{ money(raw | float if allin else (raw | float + mk) * (1 + vat / 100), pa) }}{{ '''' if allin else '' all-in · market '' ~ money(raw | float, pa) }} |

          {%- endif %}

          | **Solar still to come today** | {{ (sun | float | round(1)) ~ '' kWh'' if sun | is_number else ''–'' }} |

          {%- if best %}

          | **Best time to plug in** | {{ best[:1] | upper }}{{ best[1:] }} |

          {%- endif %}'
    visibility:
    - condition: state
      entity: binary_sensor.hesc_v3_configuration_valid
      state: 'on'
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: custom:hesc-style
