          {%- set minc = is_state(''switch.hesc_v3_minimum_charge'', ''on'') -%}

          ## <ha-icon icon="hesc:schuifregelaars"></ha-icon> Your settings

          **Start / hold** forecast {{ n(''number.hesc_v3_forecast_power_to_start'') }} / {{ n(''number.hesc_v3_forecast_power_to_hold'') }} W{{ ('' · weather station '' ~ n(''number.hesc_v3_irradiance_to_start'') ~ '' / '' ~ n(''number.hesc_v3_irradiance_to_hold'') ~ '' W/m²'') if wx else '''' }}

          **EV** full at {{ n(''number.hesc_v3_ev_full_at_battery_level'') }}% · battery {{ n(''number.hesc_v3_ev_usable_battery_capacity'') }} kWh · grid charging {{ n(''number.hesc_v3_charge_plan_grid_charging_power'') }} kW · charging above {{ n(''number.hesc_v3_ev_charging_threshold'') }} W

          **Timing** stable {{ n(''number.hesc_v3_conditions_stable_before_release'') }} · wait for charger {{ n(''number.hesc_v3_wait_for_charger_to_start'') }} · dip {{ n(''number.hesc_v3_allowed_solar_dip'') }} · stop {{ n(''number.hesc_v3_charger_stopped_before_restore'') }} · max {{ n(''number.hesc_v3_maximum_release_duration'') }} · cooldown {{ n(''number.hesc_v3_cooldown_after_release'') }} min · max {{ n(''number.hesc_v3_failed_releases_per_day_max'') }} failed releases a day

          **Charge plan** {{ (''cheap below '' ~ (states(''number.hesc_v3_charge_plan_opportunity_price'') | float(0) * 100) | round(1) ~ '' '' ~ (state_attr(''sensor.hesc_v3_prices'', ''minor'') or ''ct'')) if is_state(''switch.hesc_v3_charge_plan_take_cheap_chances'', ''on'') else ''cheap chances off'' }} · final check {{ n(''number.hesc_v3_charge_plan_final_check_before_ready_by_time'') }} min{{ ('' · minimum '' ~ n(''number.hesc_v3_minimum_charge_level'') ~ ''% within '' ~ n(''number.hesc_v3_minimum_charge_within'') ~ '' h'') if minc else '''' }}

          **Advice** last {{ n(''number.hesc_v3_advice_based_on_last'') }} days · at least {{ n(''number.hesc_v3_advice_minimum_sessions'') }} sessions

          <small>Change a value in the block on the right (column 3 · Advanced).</small>'
