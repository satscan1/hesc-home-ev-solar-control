- title: Guide
  path: guide
  icon: hesc:boek
  subview: true
  back_path: /hesc-v3/home-ev-solar-control
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '### <ha-icon icon="hesc:boek" style="--mdc-icon-size:22px;vertical-align:-5px;margin-right:4px"></ha-icon>Smart charging explained


        *A guide for everyone: what HESC does with your car, why, and what you still do yourself.*


        [Nederlandse versie](/hesc-v3/guide-nl) · [Deutsche Version](/hesc-v3/guide-de)'
      grid_options:
        columns: full
    - type: markdown
      content: '### The short version


        After about two weeks HESC runs almost on its own. Your part is small:


        1. **Plug the car in** when you get home.

        2. **Make sure your plan matches when you leave.** A weekly plan for your usual days (for example *80% on weekdays at 07:30*), and the *one fixed day per week* plan for one extra day (*100% on Saturdays at 09:00*).


        HESC does the rest. Between the moment you plug in and the moment you leave, it looks for the cheapest way to get the car where you want it. First it uses free sunshine, then the cheapest hours from the grid, and it always keeps a safety net so that the car is ready on time.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Why the first two weeks matter


        Most things work from the first day: solar charging, the charge plan, the safety net and the goal check.


        One thing gets better with time: **looking ahead at prices.** Electricity prices for tomorrow are published around 13:00. Before that, nobody knows them. HESC fills that gap with an expected price, based on what prices did in your own last 14 days, and on how sunny tomorrow is going to be (sunny days are usually cheap around midday and expensive in the evening).


        - **The first day:** no expected prices yet. HESC plans only with the prices that are known. That is fine; the safety net still gets the car ready.

        - **After one full day:** a rough expectation, simply yesterday''s pattern. Expected prices appear as grey bars in the price chart and the plan can use them.

        - **From day 3:** the expectation uses the average of all full days so far.

        - **From day 14:** it rests on two full weeks of your own prices.

        - **Every week after that:** HESC refines how sun and price relate on your market, using your own history.


        Expected prices are a guess, and HESC treats them that way: a known price always wins over an expected one, unless the expected one is clearly cheaper (2 cents per kWh or more). As soon as the real prices arrive, the plan uses those.'
      grid_options:
        columns: full
    - type: markdown
      content: '### The order HESC follows


        Every 30 seconds HESC looks at the car, the sun, the prices and your plan, and asks itself the same questions in the same order:


        | # | Question | What happens |

        |---|---|---|

        | 1 | **Is there sun?** | Your charger charges on solar in its own solar/Eco mode, as it always did (with HPVC, HESC first asks HPVC to let the sun through). HESC follows it and counts the sun in the plan, so it does not buy energy the sun will deliver anyway. |

        | 2 | **Is it one of the planned cheapest quarters?** | HESC starts the charger from the grid for that quarter of an hour. |

        | 3 | **Is time running out?** | **Safety net:** when the time left is only just enough to reach the goal, HESC starts charging, whatever the price. |

        | 4 | **Is it the last hour before you leave and the car is still short?** | **Final check:** HESC charges to your goal, whatever the price. |

        | 5 | **Is the price very low right now?** | **Cheap chance:** HESC charges now, even without a plan, *unless* enough sun is expected later today to do the same job (see below). |

        | 6 | **Is the car below the minimum you set?** | **Minimum charge** (optional, off by default): the car gets at least that level within a few hours, in the cheapest quarters of that window. |

        | 7 | Nothing of the above | HESC waits. The dashboard tells you why, for example *Waiting for the next planned quarter*. |


        A few rules apply to all of these:


        - **3% margin.** HESC only starts charging from the grid when the car is more than 3% below the goal. A car at 78% with a goal of 80% is left alone; at 76.9% it charges. This avoids starting the charger for a few minutes of nothing.

        - **Which goal?** With an active plan: the goal of that plan. Without one (cheap chances, topping up): *EV counts as full at* (default 80%). A cheap chance never fills a car that already counts as full.

        - **HESC only undoes what it started.** If you start charging yourself, or the car is already charging on sun, HESC leaves it alone.

        - **After grid charging the charger is not left on** (chargers with a start/stop switch). Otherwise the car could quietly top itself up from the grid in the evening peak. If *Back to solar mode* is filled in (Wallbox: *Resume schedule*; HESC fills it in itself), HESC pauses the charger, checks that the pause really took effect (chargers that work through the cloud react about a minute late) and then puts it back in its own solar mode, so the next sunny hour charges the car by itself. Without that field the charger stays paused, and HESC switches it on again when there is enough sun, when the car drops more than 3% below the goal and no planned charge is coming, when a plan starts, or when you unplug.'
      grid_options:
        columns: full
    - type: markdown
      content: '### How the plan picks the cheapest hours


        Say you plug in at 18:00 with the car at 40%, and your weekly plan says *80% at 07:30*.


        1. **How much is needed?** 40% of a 60 kWh battery = 24 kWh.

        2. **How much comes from the sun before 07:30?** None, it is night. (On a Saturday plan for 14:00 the morning sun would count.)

        3. **How long does that take from the grid?** At 11 kW: a bit over 2 hours, so 9 quarters.

        4. **Which 9 quarters?** The cheapest ones between now and 07:30. Usually somewhere in the night.


        The planned quarters show up in **amber** in the price chart on the *Charge plan* tab. When no plan is active, the chart shows no planned quarters and the plan card says *No charging plan active*.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Cheap chances and the sun


        *Take cheap chances* (on the *Charge plan* tab) charges whenever the price drops below *Cheap when below*, even without a plan. These moments show in **blue-green** in the price chart.


        But a cheap moment in the morning is not a bargain when the afternoon sun would have filled the car for free. So before taking a cheap chance, HESC looks at the solar forecast for the rest of that day. If the sun is expected to cover what the car still needs, with 20% to spare, the cheap chance is skipped. You then see *Cheap chance skipped: enough sun today*, and the price chart leaves those quarters out.


        **Grid charging and the sun at the same time.** If your charger lets HESC set its charging current (for a Wallbox: the *Maximum charging current* setting, which needs an admin account), HESC turns the charger down while it charges from the grid and the sun is shining. More of the charge then comes from your solar panels and less from the grid. This is normal behaviour, there is nothing to switch on: HESC only does it while the car will still be full on time, and afterwards it puts the current back to what it was. HESC works out by itself whether your charger uses 1 or 3 phases.


        **Phase advice.** Some chargers only start when every phase has enough sun to spare (a Wallbox on Eco about 480 W per phase, an Easee 6 A per phase). If your solar panels are spread unevenly over the phases, the weakest phase then decides when your car can charge on the sun. When you choose the grid power per phase under the sources, HESC measures this on days with sun and tells you what it saw: first the spread over the phases, later how often the weakest phase kept your charger from starting. The sunniest period is worked out for your location, so HESC only says *confirmed* after it has seen it. It is advice only, HESC changes nothing.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Home battery and EV


        *Optional, off by default. Only for homes with a home battery.*


        On a sunny morning the home battery usually takes all the spare sun first. The charger in solar mode then sees no surplus and waits, sometimes until the home battery is full in the afternoon. On a day with less sun, that can mean the car gets nothing.


        With **Home battery and EV** switched on, HESC helps the car get its turn:


        1. **Kickstart.** When the car is plugged in and waiting for sun, the home battery has been charging for a few minutes and the cautious forecast says there is enough sun now, HESC checks the rest of the day. Is there clearly more sun left than the home battery still needs (with 20% to spare, and at least *Minimum sun left for the EV*)? Then HESC gives the charger a short start. Your battery system sees the car charging and stops filling the home battery; HESC then puts the charger back in its own solar mode, which keeps charging on the sun that is now free.

        2. **Back to the home battery.** Later in the day, when the sun left is only just enough to fill the home battery, HESC puts the charger back to waiting, so the home battery is full by the evening. After that there is no new kickstart that day.


        During the short start the home battery may deliver some power to the car for a moment. That is expected and small.


        HESC never controls the home battery itself. It only decides when the car starts, and reads the home battery level and power. It does nothing while a charge plan is charging, during an HPVC release, or after sunset, and at most a few times a day (*Kickstarts per day*, default 3, with at least 30 minutes in between).


        What you fill in (Settings, block 3, *Home battery and EV* → *Settings*): the level sensor(s) of your home battery, its power sensor(s) (positive = charging) and its total size in kWh. It also needs the charger''s start/stop switch and *Back to solar mode* (block 3, *Plan and notifications*); with charger type Wallbox both are filled in for you. When the car is plugged in, Main shows what it is doing in an extra line under *Current state*.'
      grid_options:
        columns: full
    - type: markdown
      content: '### What will it cost?


        The **Expected charge cost** badge at the top of Main shows what the active plan is expected to cost from the grid, with the same rule as the Costs page (the price of each planned quarter, plus your mark-up and VAT, or the all-in price). It only counts grid charging that will really happen: without an active plan, with the car already at its goal, or when the car is already charging on sun, it shows 0.00.


        **What did it cost?** Tap the **Costs** badge on Main. Per day, week, month, quarter or year you see how much went into the car, how much of that came from the sun (green) and from the grid (grey), and what the grid part cost at the price of that quarter. You set your mark-up, VAT and the value of a solar kWh once under *Settings → Charging costs*; the whole history follows. **Export to spreadsheet (CSV)** at the bottom writes two files you can open in Excel.


        All amounts are in the currency of your prices (€, kr, £ or $), written the way your country does it.'
      grid_options:
        columns: full
    - type: markdown
      content: '### On your phone and watch


        HESC works with the Home Assistant app on your iPhone (or Android phone), also away from home.


        - **Widget or Apple Watch:** in the Home Assistant app, add the sensor *Summary for phone and watch* as a widget or as a watch complication. It shows for example *EV 72% → 80% by Sat 24-10 07:00 · Charging on sun*.

        - **Siri or Shortcuts:** make a shortcut with the Home Assistant action *Perform action* → **HESC: Set charge plan** (day, time, goal) or **HESC: Charge plan off**. Then say for example *Hey Siri, charge the car for tomorrow*. Also there: **HESC: Charge now** (to a goal, from the grid, at once), **HESC: Skip a day of the repeating plan** (a day off; the plan itself stays) and the two that undo them.

        - **Lock screen:** the *Details* or *Gauge* widget of the Home Assistant app follows the summary at once: HESC asks the iPhones in its phone list to refresh it when something changes (at most every 20 minutes). The home-screen widgets refresh about every 15 minutes, iOS decides that.

        - **Android and Wear OS:** the *Entity state* widget with the summary, and an *Action button* widget, quick-settings tile or watch tile that presses a HESC button (charge now, stop, skip a day, plan off) or runs your own script. Android widgets refresh by themselves (at once with *Real-time* on in the app''s notification access).

        - **Notifications:** choose your phone on the Settings page (*Notifications: add or remove a phone*).'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: markdown
      content: '### Situations


        #### "I drive to work every weekday"


        Make a **weekly plan**: tick the days, set the time you leave and the level you want. Leave it active. Plug in when you get home. That is all.


        #### "I''m going on a trip on Saturday"


        Use the plan **one fixed day per week**: pick *Saturday*, the time you leave and for example 100%, and switch it on. When it and the weekly plan are both active, the earliest one wins; your weekly plan simply continues.


        This plan comes back every week on the same day and time. Only need it once? Switch *Active* off after the trip.


        #### "The car stays at home for a few days"


        No plan is needed. The car charges on sun, takes cheap chances when they come, and the charger stays paused otherwise. Only when the car drops more than 3% below *EV counts as full at* does HESC top it up.


        #### "I came home with an almost empty battery and might need the car tonight"


        Switch on **Minimum charge** (Settings, block 3, *Use*). Default: at least 20% within 3 hours. HESC picks the cheapest quarters in those 3 hours, and charges straight away if no prices are known. Both numbers can be changed under *Settings*.


        #### "I have a home battery and the car never gets any sun"


        Switch on **Home battery and EV** (Settings, block 3, *Use*) and fill in your home battery under *Settings*. See *Home battery and EV* above.


        #### "I need the car now, forget the plan"


        Start charging yourself (app, charger button or the charger''s own mode). HESC sees the car is already charging and leaves it alone.


        #### "I plugged in late; is there still time?"


        HESC checks this all the time. If the time left is only just enough, the safety net starts charging straight away. If the goal is still missed, you get a notification on your phone at the time you wanted to leave: *EV goal missed*, with the level it reached.


        #### "Tomorrow is going to be sunny"


        The plan counts the sun in advance (cautious forecast, minus a little for the house), so it buys less from the grid. Cheap chances that the sun would make unnecessary are skipped.


        #### "Tomorrow''s prices aren''t known yet"


        Normal before about 13:00. After the first few days the plan uses expected prices (grey bars) and firms up as soon as the real prices arrive.


        #### "My car stops at 80% by itself"


        Many cars have their own charge limit. If it is lower than your goal, the charger stops by itself and HESC shows *Finished, charger stopped by itself*. Set your goal at or below the car''s own limit, or raise the limit in the car.


        #### "The charger did not respond"


        Chargers that work through the cloud sometimes ignore a command. HESC checks and tries again: a refused start or resume after 5 minutes, a refused pause after 30 minutes, each at most 3 times. Before putting the charger back in its solar mode, HESC waits until the pause has really taken effect.


        #### "Home Assistant restarted during charging"


        HESC keeps using the last valid plan for up to 10 minutes, so a running charge does not stop.


        #### "I just restarted Home Assistant and some values are empty, or the setup check shows a red <ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon>"


        That is normal and fixes itself; nothing for you to do. Prices, settings and the setup check are back at once; EV battery level, costs and the notice line within about 5 minutes; the price forecast (expected prices in the chart) within 15 minutes; the start threshold advice within a few minutes. A red <ha-icon icon="hesc:kruis-cirkel" style="--mdc-icon-size:16px;vertical-align:-3px;margin-right:4px"></ha-icon> can show for a moment while your charger, inverter or car integration is still starting. Still red after 15 minutes? Then something really is missing, and the right settings open by themselves. Right after a restart the car integration can also briefly report an old battery level; HESC follows the correction at its next round.


        #### "I''m on holiday"


        Switch on **Holiday mode** under the weekly plan. The weekly plan then does nothing; your one-day plan stays active, so you can still have a full car on the day you come back. Solar charging carries on as usual. Set **Holiday until** if you like: the day after that date, holiday mode switches itself off.'
      grid_options:
        columns: full
    - type: markdown
      content: '### What you set once


        | Setting | Where | Default | Tip |

        |---|---|---|---|

        | Usable battery capacity | *Charge plan* tab | 60 kWh | What your car can really use |

        | Grid charging power | *Charge plan* tab | 11 kW | A little below what your charger really delivers gives some margin |

        | Take cheap chances / Cheap when below | *Charge plan* tab | your choice / 0.05 per kWh | In the currency of your prices. Lower = fewer but better chances |

        | EV counts as full at | *Charge plan* tab and Settings | 80% | The level to keep without a plan |

        | Final check | Settings | 60 min | How long before you leave HESC charges whatever the price |

        | Minimum charge | Settings, block 3 | off (20%, 3 h) | Use + Settings switches |

        | Home battery and EV | Settings, block 3 | off (3 per day) | Only with a home battery; Use + Settings switches |

        | Back to solar mode | Settings, block 3, *Plan and notifications* | filled in for Wallbox | Puts the charger back in its own solar mode after grid charging |

        | Phones for notifications | Settings, block 3, *Plan and notifications* | none | Pick them from the list; test with *Send a test notification* |

        | Morning summary | Settings, block 3, *Plan and notifications* | off (06:00) | One message a day: battery level, next plan, sun today, yesterday |

        | Charging costs | Settings, *Charging costs* | mark-up 0, VAT 0, solar kWh free | Or switch on *all-in* when your price sensor already has the full price |'
      grid_options:
        columns: full
    - type: markdown
      content: '### Where to look


        - **Status** on the dashboard: one line saying what HESC does now and why.

        - **Price chart** (*Charge plan* tab): amber = planned, blue-green = cheap chance, grey = expected price.

        - **Notice line** (top of Main): *✓ No notices*, or what needs attention. Red = the charge goal is at risk (also on your phone), orange = a sensor is missing but HESC keeps working, grey = just so you know. Tap it to go where you can act.

        - **Expected charge cost** (badge at the top of Main): what the active plan is expected to cost.

        - **Costs** (badge at the top of Main): what went into the car, from the sun and from the grid, and what it cost.

        - **Setup check** (*Settings* tab): one line per part with a tick and the values of now. When something is wrong, that part opens by itself and says what is missing.

        - **Report**: everything HESC measured and decided, for yourself or when you ask for help.


        See also: [How it works](https://github.com/satscan1/hesc-home-ev-solar-control/blob/main/docs/04-how-it-works.md) for the details, and [A day with HESC](https://github.com/satscan1/hesc-home-ev-solar-control/blob/main/docs/08-a-day-with-hesc.md) for an example day.'
      grid_options:
        columns: full
- title: Uitleg
  path: guide-nl
  icon: hesc:boek
  subview: true
  back_path: /hesc-v3/home-ev-solar-control
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '### <ha-icon icon="hesc:boek" style="--mdc-icon-size:22px;vertical-align:-5px;margin-right:4px"></ha-icon>Slim laden uitgelegd


        *Een uitleg voor iedereen: wat HESC met je auto doet, waarom, en wat je zelf nog doet.*



        [English version](/hesc-v3/guide) · [Deutsche Version](/hesc-v3/guide-de)'
      grid_options:
        columns: full
    - type: markdown
      content: '### In het kort


        Na ongeveer twee weken werkt HESC bijna helemaal vanzelf. Jouw deel is klein:


        1. **Stekker erin** als je thuiskomt.

        2. **Zorg dat je planning klopt met je vertrektijd.** Een weekplan voor je vaste dagen (bijvoorbeeld *80% op werkdagen om 07:30*), en het plan *één vaste dag per week* voor één extra dag (*100% op zaterdag om 09:00*).


        De rest doet HESC. Tussen het moment dat je aansluit en het moment dat je vertrekt, zoekt het de goedkoopste manier om de auto op het gewenste niveau te krijgen. Eerst met gratis zonnestroom, dan met de goedkoopste uren van het net, en altijd met een vangnet zodat de auto op tijd klaar is.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Waarom de eerste twee weken ertoe doen


        Het meeste werkt vanaf de eerste dag: laden op zon, het laadplan, het vangnet en de controle van je doel.


        Eén ding wordt beter met de tijd: **vooruitkijken naar prijzen.** De stroomprijzen voor morgen komen rond 13:00 uit. Daarvoor weet niemand ze. HESC vult dat gat met een verwachte prijs, op basis van wat de prijzen de afgelopen 14 dagen bij jou deden, en van hoe zonnig het morgen wordt (zonnige dagen zijn meestal goedkoop rond het middaguur en duur in de avond).


        - **De eerste dag:** nog geen verwachte prijzen. HESC plant alleen met de prijzen die bekend zijn. Geen probleem: het vangnet zorgt dat de auto toch klaar is.

        - **Na één volle dag:** een ruwe verwachting, gewoon het patroon van gisteren. Verwachte prijzen verschijnen als grijze staven in de prijsgrafiek en het plan mag ze gebruiken.

        - **Vanaf dag 3:** de verwachting gebruikt het gemiddelde van alle volle dagen tot nu toe.

        - **Vanaf dag 14:** de verwachting rust op twee volle weken van je eigen prijzen.

        - **Daarna elke week:** HESC stelt met je eigen geschiedenis bij hoe zon en prijs op jouw markt samenhangen.


        Een verwachte prijs blijft een schatting, en HESC gaat er ook zo mee om: een bekende prijs gaat altijd voor op een verwachte, tenzij de verwachte duidelijk goedkoper is (2 cent per kWh of meer). Zodra de echte prijzen er zijn, gebruikt het plan die.'
      grid_options:
        columns: full
    - type: markdown
      content: '### De volgorde die HESC aanhoudt


        Elke 30 seconden kijkt HESC naar de auto, de zon, de prijzen en je plan, en stelt zichzelf steeds dezelfde vragen in dezelfde volgorde:


        | # | Vraag | Wat er gebeurt |

        |---|---|---|

        | 1 | **Is er zon?** | Je laadpaal laadt op zon in zijn eigen zon-/Eco-stand, zoals altijd (met HPVC vraagt HESC eerst aan HPVC om de zon door te laten). HESC volgt dat en rekent de zon mee in het plan, zodat het geen stroom koopt die de zon toch levert. |

        | 2 | **Is het een van de geplande goedkoopste kwartieren?** | HESC zet de laadpaal dat kwartier aan op netstroom. |

        | 3 | **Raakt de tijd op?** | **Vangnet:** is de resterende tijd nog maar net genoeg om het doel te halen, dan start HESC het laden, wat de prijs ook is. |

        | 4 | **Is het het laatste uur voor vertrek en zit de auto nog onder het doel?** | **Eindcontrole:** HESC laadt tot je doel, wat de prijs ook is. |

        | 5 | **Is de prijs nu erg laag?** | **Goedkope kans:** HESC laadt nu, ook zonder plan, *tenzij* er later vandaag genoeg zon verwacht wordt om hetzelfde te doen (zie verderop). |

        | 6 | **Zit de auto onder het minimum dat je hebt ingesteld?** | **Minimumlading** (optioneel, standaard uit): de auto krijgt binnen een paar uur minstens dat niveau, in de goedkoopste kwartieren van dat venster. |

        | 7 | Niets van dit alles | HESC wacht. Het dashboard zegt waarom, bijvoorbeeld *Waiting for the next planned quarter*. |


        Voor alles hierboven gelden een paar regels:


        - **3% marge.** HESC laadt pas van het net als de auto meer dan 3% onder het doel zit. Een auto op 78% met een doel van 80% blijft met rust; op 76,9% wordt er geladen. Zo start de laadpaal niet voor een paar minuten niets.

        - **Welk doel?** Met een actief plan: het doel van dat plan. Zonder plan (goedkope kansen, bijladen): *Auto telt als vol bij* (standaard 80%). Een goedkope kans vult dus nooit een auto die al als vol telt.

        - **HESC maakt alleen ongedaan wat het zelf startte.** Start je zelf met laden, of laadt de auto al op zon, dan laat HESC het met rust.

        - **Na het laden van het net blijft de laadpaal niet aan staan** (laadpalen met een start/stop-schakelaar). Anders kan de auto stilletjes in de dure avondpiek bijladen van het net. Is *Terug naar zonnestand* ingevuld (Wallbox: *Resume schedule*; HESC vult dat zelf in), dan zet HESC de laadpaal op pauze, controleert dat de pauze echt is doorgekomen (laadpalen via de cloud reageren ongeveer een minuut later) en zet hem daarna terug in zijn eigen zonnestand, zodat het volgende zonnige uur de auto vanzelf laadt. Zonder dat veld blijft de laadpaal op pauze, en zet HESC hem weer aan als er genoeg zon is, als de auto meer dan 3% onder het doel zakt en er geen geplande lading meer komt, als een plan start, of als je de stekker eruit haalt.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Hoe het plan de goedkoopste uren kiest


        Stel: je sluit om 18:00 aan met de auto op 40%, en je weekplan zegt *80% om 07:30*.


        1. **Hoeveel is er nodig?** 40% van een accu van 60 kWh = 24 kWh.

        2. **Hoeveel komt er van de zon vóór 07:30?** Niets, het is nacht. (Bij een plan voor zaterdag 14:00 zou de ochtendzon wel meetellen.)

        3. **Hoe lang duurt dat van het net?** Bij 11 kW: iets meer dan 2 uur, dus 9 kwartieren.

        4. **Welke 9 kwartieren?** De goedkoopste tussen nu en 07:30. Meestal ergens in de nacht.


        De geplande kwartieren zie je **oranje** in de prijsgrafiek op het tabblad *Laadplan*. Staat er geen plan aan, dan toont de grafiek geen geplande kwartieren en zegt de plankaart *Geen laadplan actief*.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Goedkope kansen en de zon


        *Goedkope kansen pakken* (op het tabblad *Laadplan*) laadt zodra de prijs onder *Goedkoop onder* zakt, ook zonder plan. Die momenten zie je **blauwgroen** in de prijsgrafiek.


        Maar een goedkoop moment in de ochtend is geen koopje als de middagzon de auto gratis had kunnen vullen. Daarom kijkt HESC eerst naar de zonverwachting voor de rest van die dag. Dekt de zon naar verwachting wat de auto nog nodig heeft, met 20% over, dan wordt de goedkope kans overgeslagen. Je ziet dan *Cheap chance skipped: enough sun today*, en de prijsgrafiek laat die kwartieren weg.


        **Netladen en zon tegelijk.** Laat je laadpaal HESC de laadstroom instellen (bij een Wallbox: de instelling *Maximum charging current*, daarvoor is een beheerdersaccount nodig), dan zet HESC de laadpaal zachter zolang hij uit het net laadt en de zon schijnt. Er komt dan meer uit je zonnepanelen en minder uit het net. Dit is normaal gedrag, je hoeft niets aan te zetten: HESC doet het alleen zolang de auto op tijd vol is, en zet de stroom daarna terug zoals hij was. Of je laadpaal op 1 of 3 fasen laadt, ziet HESC zelf.


        **Fase-advies.** Sommige laadpalen starten pas als er op elke fase genoeg zon over is (een Wallbox op Eco ongeveer 480 W per fase, een Easee 6 A per fase). Liggen je zonnepanelen ongelijk over de fasen, dan bepaalt de zwakste fase wanneer je auto op zon kan laden. Kies je bij de bronnen het netvermogen per fase, dan meet HESC dit op dagen met zon en vertelt wat het zag: eerst de verdeling over de fasen, later hoe vaak de zwakste fase je laadpaal tegenhield. De zonnigste periode rekent HESC uit voor jouw locatie, dus pas als die gezien is staat er *confirmed*. Het is alleen advies, HESC verandert niets.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Thuisbatterij en auto


        *Optioneel, standaard uit. Alleen voor huizen met een thuisbatterij.*


        Op een zonnige ochtend pakt de thuisbatterij meestal eerst alle zon die over is. De laadpaal in zonnestand ziet dan geen overschot en wacht, soms tot de thuisbatterij ''s middags vol is. Op een dag met minder zon kan dat betekenen dat de auto niets krijgt.


        Met **Thuisbatterij en auto** aan helpt HESC de auto aan de beurt te komen:


        1. **Aftrap.** Hangt de auto aan de laadpaal en wacht hij op zon, laadt de thuisbatterij al een paar minuten en zegt de voorzichtige verwachting dat er nu genoeg zon is, dan kijkt HESC naar de rest van de dag. Is er duidelijk meer zon over dan de thuisbatterij nog nodig heeft (met 20% over, en minstens *Minimale zon over voor de auto*)? Dan geeft HESC de laadpaal een korte start. Je batterijsysteem ziet de auto laden en stopt met het vullen van de thuisbatterij; daarna zet HESC de laadpaal terug in zijn eigen zonnestand, die blijft laden op de zon die nu vrijkomt.

        2. **Terug naar de thuisbatterij.** Later op de dag, als de resterende zon nog maar net genoeg is om de thuisbatterij te vullen, zet HESC de laadpaal weer op wachten, zodat de thuisbatterij ''s avonds vol is. Daarna volgt die dag geen nieuwe aftrap.


        Tijdens de korte start kan de thuisbatterij heel even wat stroom aan de auto leveren. Dat is normaal en weinig.


        HESC stuurt de thuisbatterij nooit zelf. Het bepaalt alleen wanneer de auto start, en leest het niveau en het vermogen van de thuisbatterij. Het doet niets terwijl een laadplan laadt, tijdens een vrijgave van HPVC of na zonsondergang, en hoogstens een paar keer per dag (*Kickstarts per dag*, standaard 3, met minstens 30 minuten ertussen).


        Wat je invult (Instellingen, blok 3, *Thuisbatterij en auto* → *Opties*): de niveausensor(en) van je thuisbatterij, de vermogenssensor(en) (positief = laden) en de totale grootte in kWh. Het heeft ook de start/stop-schakelaar van de laadpaal nodig en *Terug naar zonnestand* (blok 3, *Laadplan en meldingen*); bij laadpaaltype Wallbox worden die twee voor je ingevuld. Hangt de auto aan de laadpaal, dan laat Overzicht in een extra regel onder *Huidige stand* zien wat het doet.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Wat gaat het kosten?


        Het kadertje **Verwachte laadkosten** bovenaan Overzicht toont wat het actieve plan naar verwachting van het net kost, met dezelfde rekenregel als de kostenpagina (de prijs van elk gepland kwartier, plus je opslag en btw, of de all-in prijs). Het telt alleen netladen dat echt gaat gebeuren: zonder actief plan, als de auto zijn doel al heeft, of als de auto al op zon laadt, staat er 0,00.


        **Wat heeft het gekost?** Tik op het kadertje **Kosten** bovenaan Overzicht. Per dag, week, maand, kwartaal of jaar zie je hoeveel er in de auto ging, hoeveel daarvan van de zon kwam (groen) en van het net (grijs), en wat het netdeel kostte tegen de prijs van dat kwartier. Je opslag, btw en de waarde van een zon-kWh stel je één keer in onder *Instellingen → Laadkosten*; de hele geschiedenis rekent mee. Met **Exporteren naar spreadsheet (CSV)** onderaan maak je twee bestanden die je in Excel opent.


        Alle bedragen staan in de munt van je prijzen (€, kr, £ of $), geschreven zoals dat in jouw land gebruikelijk is.'
      grid_options:
        columns: full
    - type: markdown
      content: '### Op je telefoon en horloge


        HESC werkt met de Home Assistant-app op je iPhone (of Android-telefoon), ook van buitenaf.


        - **Widget of Apple Watch:** zet in de Home Assistant-app de sensor *Samenvatting voor telefoon en horloge* als widget of als complicatie op je horloge. Die laat bijvoorbeeld zien: *EV 72% → 80% by Sat 24-10 07:00 · Charging on sun*.

        - **Siri of Opdrachten:** maak een opdracht met de Home Assistant-handeling *Voer actie uit* → **HESC: Laadplan instellen** (dag, tijd, doel) of **HESC: Laadplan uit**. Zeg daarna bijvoorbeeld *Hé Siri, laad de auto voor morgen*. Ook daar: **HESC: Nu laden** (meteen van het net laden tot een doel), **HESC: Een dag van het weekplan overslaan** (een vrije dag; het plan zelf blijft staan) en de twee die dat weer ongedaan maken.

        - **Vergrendelscherm:** de widget *Details* of *Gauge* van de Home Assistant-app volgt de samenvatting meteen: HESC vraagt de iPhones in zijn telefoonlijst om te verversen als er iets verandert (hooguit eens per 20 minuten). De widgets op het beginscherm verversen ongeveer elke 15 minuten; dat bepaalt iOS.

        - **Android en Wear OS:** de widget *Entiteitsstatus* met de samenvatting, en een widget *Actieknop*, snelknop of horlogetegel die een HESC-knop indrukt (nu laden, stop, dag overslaan, plan uit) of je eigen script start. Android-widgets verversen zelf (meteen met *Real-time* aan bij de meldingstoegang van de app).

        - **Meldingen:** kies je telefoon op de pagina Instellingen (*Telefoon toevoegen of weghalen*).'
      grid_options:
        columns: full
  - type: grid
